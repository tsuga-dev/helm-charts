---
name: Integration Test - tsuga-operator

permissions: {}
on:
  pull_request:
    branches: [main]
    paths:
      - "charts/tsuga-operator/**"
      - ".github/workflows/integration-tsuga-operator.yml"
  push:
    branches: [main]
    paths:
      - "charts/tsuga-operator/**"
      - ".github/workflows/integration-tsuga-operator.yml"

env:
  HELM_VERSION: "3.12.0"
  NS: tsuga-system
  RELEASE: tsuga-operator

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: CRDs match the operator release
        run: |
          tag="v$(yq '.appVersion' charts/tsuga-operator/Chart.yaml)"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" \
            https://github.com/tsuga-dev/tsuga-operator.git "$RUNNER_TEMP/operator"
          if ! diff -r "$RUNNER_TEMP/operator/config/crd/bases" charts/tsuga-operator/conf/crds; then
            echo "::error::charts/tsuga-operator/conf/crds differs from tsuga-operator $tag. Copy config/crd/bases from that tag."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0

      - name: Install chart
        run: |
          helm install "$RELEASE" charts/tsuga-operator \
            --namespace "$NS" --create-namespace \
            --set credentials.apiToken=dummy-ci-token \
            --wait --timeout 3m
          test "$(kubectl get crd -o name | grep -c observability.tsuga.com)" -eq 6

      # A dummy token makes the API answer 401. Seeing that in the CR status
      # proves the operator read the chart's Secret, called the API and has
      # RBAC to write status on a CR outside its own namespace.
      - name: Reconcile a Monitor
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: observability.tsuga.com/v1alpha1
          kind: Monitor
          metadata:
            name: ci-monitor
            namespace: default
          spec:
            name: CI Monitor
            owner: ci
            priority: 3
            permissions: all
            configuration:
              type: metric
              timeframe: 5
              noDataBehavior: alert
              groupByFields: []
              aggregationAlertLogic: no_aggregation
              conditions:
                - formula: q1
                  operator: greater_than
                  threshold: 1
              queries:
                - aggregate:
                    type: sum
                    field: traces.span.metrics.calls
                  filter: ""
                  fill:
                    mode:
                      type: zero
          EOF
          kubectl -n default wait monitor/ci-monitor \
            --for=jsonpath='{.status.phase}'=Error --timeout=2m
          kubectl -n default get monitor ci-monitor -o jsonpath='{.status.message}' | grep 401

      - name: Check metrics endpoint auth
        run: |
          kubectl -n "$NS" create serviceaccount scraper
          kubectl create clusterrolebinding scraper \
            --clusterrole="$RELEASE-metrics-reader" --serviceaccount="$NS:scraper"
          token=$(kubectl -n "$NS" create token scraper)
          kubectl -n "$NS" port-forward "svc/$RELEASE-metrics" 8443:8443 &
          sleep 5
          url=https://localhost:8443/metrics
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$url")" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$url")" = 401

      - name: Upgrade to 2 replicas
        run: |
          helm upgrade "$RELEASE" charts/tsuga-operator -n "$NS" \
            --reuse-values --set replicaCount=2 --wait --timeout 3m

      - name: Uninstall keeps CRDs and CRs
        run: |
          helm uninstall "$RELEASE" -n "$NS" --wait
          test "$(kubectl get crd -o name | grep -c observability.tsuga.com)" -eq 6
          kubectl -n default get monitor ci-monitor

      - name: Reinstall over kept CRDs
        run: |
          helm install "$RELEASE" charts/tsuga-operator -n "$NS" \
            --set credentials.apiToken=dummy-ci-token --wait --timeout 3m

      - name: Debug dump on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get monitors -A -o yaml || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs "deploy/$RELEASE" --tail=200 || true
