# git-cliff configuration for opentelemetry-kube-stack chart
# https://git-cliff.org/docs/configuration
# Run from repo root: git cliff -c charts/opentelemetry-kube-stack/cliff.toml

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{%- set grouped_commits = commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") -%}
{%- set first_time_contributors = github.contributors | filter(attribute="is_first_time", value=true) -%}
{%- if version and (grouped_commits | length > 0 or first_time_contributors | length > 0) %}

## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- for group, commits in grouped_commits %}

### {{ group | striptags | trim | upper_first }}
{%- for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{%- if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}
  {{ commit.breaking_description | split(pat="\n") | first | upper_first | trim }}
{%- endif %}
{%- endfor %}
{%- endfor %}
{%- if first_time_contributors | length != 0 %}

### New Contributors
{% for contributor in first_time_contributors -%}
* @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor -%}
{%- endif %}
{%- endif -%}
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{%- for release in releases -%}
{%- if release.version and release.previous.version %}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
{% endif %}
{%- endfor %}
<!-- generated by git-cliff -->
"""
trim = true
output = "charts/opentelemetry-kube-stack/CHANGELOG.md"

[git]
conventional_commits = true
filter_unconventional = false
# Only commits that touch this chart
include_paths = ["charts/opentelemetry-kube-stack/**"]
exclude_paths = ["charts/opentelemetry-kube-stack/CHANGELOG.md", "charts/opentelemetry-kube-stack/examples/*/rendered/**"]
# Tags created by helm chart-releaser for this chart (e.g. opentelemetry-kube-stack-0.6.1)
tag_pattern = "opentelemetry-kube-stack-[0-9].*"
commit_parsers = [
  # Breaking changes get their own group, whether flagged with `type!:` or a
  # `BREAKING CHANGE:` footer. Must come first: parsing stops at the first match.
  { message = "^[a-zA-Z]+(\\(.*\\))?!:", group = "<!-- 0 -->Breaking Changes" },
  { footer = "^BREAKING[ -]CHANGE:", group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^docs", group = "<!-- 1 -->Added" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^style", group = "<!-- 3 -->Changed" },
  { message = "^test", group = "<!-- 3 -->Changed" },
  { message = "^chore", group = "<!-- 3 -->Changed" },
  { message = "^ci", group = "<!-- 3 -->Changed" },
  { message = "^.*", group = "<!-- 3 -->Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
