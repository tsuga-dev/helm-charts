---
# yaml-language-server: $schema=./values.schema.json
# =============================================================================
# SECURITY NOTICE
# =============================================================================
#
# IMPORTANT SECURITY GUIDELINES:
# 1. Never commit sensitive credentials (API keys, passwords, tokens) to version control
# 2. Use --set flags to provide sensitive values at deployment time
# 3. Consider using external secret management systems (e.g., Sealed Secrets, External Secrets Operator)
# 4. Use Kubernetes secrets for sensitive configuration data
# 5. Rotate credentials regularly and use least-privilege access
#
# SECRET MANAGEMENT OPTIONS:
#
# Option 1: Let the chart create the secret
# helm install my-otel-stack ./charts/opentelemetry-kube-stack \
#   --set clusterName="<CLUSTER_NAME>" \
#   --set secret.create=true \
#   --set tsuga.otlpEndpoint="https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp" \
#   --set tsuga.apiKey="<TSUGA_API_KEY>"
#
# Option 2: Use existing secret
# helm install my-otel-stack ./charts/opentelemetry-kube-stack \
#   --set clusterName="<CLUSTER_NAME>" \
#   --set secret.create=false \
#   --set secret.name="my-existing-secret" \
#   --set secret.keyMapping.TSUGA_API_KEY="<API_KEY_SECRET_KEY>" \
#   --set secret.keyMapping.TSUGA_OTLP_ENDPOINT="<OTLP_ENDPOINT_SECRET_KEY>"
#
# Option 3: External secret management (recommended for production)
# - Use Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
# - Use External Secrets Operator: https://external-secrets.io/
# - Use HashiCorp Vault with External Secrets Operator
#
# =============================================================================
# CONFIGURATION ARCHITECTURE
# =============================================================================
#
# This chart uses a flexible configuration system with two approaches:
#
# 1. MERGE-BASED (Recommended): Uses default configs + additions
#    - Default configs are defined in _default-deamonset-config.tpl,
#      _default-cluster-receiver-config.tpl and _default-statefulset-config.tpl
#    - Use extraReceivers, extraProcessors, extraExporters to ADD components
#    - These can only add. A key that the chart already sets is NOT overridden:
#      the merge keeps the chart's value and silently drops yours. To change a
#      default, use the dedicated value for it, or customConfig below.
#
# 2. FULL CUSTOM: Provide complete OpenTelemetry config
#    - Set customConfig with your complete YAML configuration
#    - This completely replaces the default configuration
#    - Example: agent.customConfig: |-
#        receivers:
#          otlp:
#            protocols:
#              grpc:
#                endpoint: 0.0.0.0:4317

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================
# Telemetry from a cluster that does not name itself cannot be told apart from
# any other cluster's once it reaches Tsuga, and the omission only becomes
# visible during an incident, which is the worst time to discover it. Any
# collector rendering the chart's default config fails the install when this is
# empty.
# Set via: --set clusterName="<CLUSTER_NAME>"
# -- REQUIRED. Name of the cluster, attached to all telemetry as
# k8s.cluster.name. The install fails while this is empty and any collector is
# rendering the chart's default config.
# @default -- "" (must be set)
clusterName: ""

# -- Override the chart name used in resource naming.
# @default -- ""
nameOverride: ""

# -- Override the full name used in resource naming.
# @default -- ""
fullnameOverride: ""

# Override per collector with agent.image, cluster.image or statefulset.image.
# Keep the tag: an untagged image resolves to :latest, which forces
# imagePullPolicy: Always and skips the version floor check. Set to "" to let the
# operator choose the image.
# -- Collector image used by all three collectors. Must be v0.157.0 or newer: the
# default config uses the cumulative_to_delta processor, and the chart fails the
# render on an older tag. Keep the tag, because an untagged image resolves to
# :latest and skips that check.
image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0

# =============================================================================
# TSUGA CONFIGURATION
# =============================================================================
# SECURITY WARNING: Never commit sensitive credentials to version control
# Provide these values via --set flags or external secrets management
tsuga:
  # Set via: --set tsuga.otlpEndpoint="https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
  # -- Tsuga OTLP endpoint, e.g. `https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp`.
  # Give the base path with no signal suffix; the exporter appends `/v1/traces`,
  # `/v1/metrics` and `/v1/logs` itself.
  # @default -- ""
  otlpEndpoint: ""
  # Set via: --set tsuga.apiKey="<TSUGA_API_KEY>"
  # Leave empty when an external secret manager supplies the key.
  # -- Tsuga API key, sent as an `Authorization: Bearer` header. Only written into
  # the secret while secret.create is true.
  # @default -- ""
  apiKey: ""
  # These four are also read together: only when all of them are false does the
  # chart stop injecting TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT into every collector
  # and stop exporting collector self-telemetry. Any one left true keeps both.
  # -- Enable the Tsuga OTLP exporter in the cluster receiver's default config.
  # @default -- true
  enabledForClusterReceiver: true
  # -- Enable the Tsuga OTLP exporter in the agent's default config.
  # @default -- true
  enabledForDaemonset: true
  # -- Enable the Tsuga OTLP exporter in the StatefulSet collector's default config.
  # @default -- true
  enabledForStatefulset: true
  # -- Enable the Tsuga OTLP exporter in the profiling collector's default config.
  # Only read when profiling.enabled is true.
  # @default -- true
  enabledForProfiling: true
  # `proto` sends fewer bytes over the wire than `json`, even after compression, so
  # it is the cheaper choice where the intake accepts it. Note the collector's own
  # default is `proto`; this chart defaults to `json`.
  # -- Payload encoding for the OTLP exporter. One of `json`, `proto`.
  # @default -- "json"
  encoding: json
  # `gzip` is the safe default. `zstd` compresses harder for more CPU; `none` is
  # only worth it when something downstream already compresses.
  # -- Compression for the OTLP exporter. One of `gzip`, `zlib`, `deflate`, `snappy`,
  # `zstd`, `lz4`, `none`.
  # @default -- "gzip"
  compression: gzip

# =============================================================================
# SECRET CONFIGURATION
# =============================================================================
secret:
  # -- Create the Kubernetes secret holding the Tsuga credentials. Leave this false
  # only when a secret named secret.name already exists: every collector reads
  # TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT from it, and a missing secret leaves the
  # pods in CreateContainerConfigError.
  # @default -- false
  create: false
  # -- Name of the secret.
  # Used when create=true (name of secret to create).
  # Used when create=false (name of existing secret to use).
  # @default -- "otel-secret"
  name: "otel-secret"
  # -- Key mapping for existing secret (used when create=false).
  # Maps chart expected keys to keys in the existing secret.
  keyMapping:
    # -- Key name in the secret for Tsuga API key.
    # @default -- "TSUGA_API_KEY"
    TSUGA_API_KEY: "TSUGA_API_KEY"
    # -- Key name in the secret for Tsuga OTLP endpoint.
    # @default -- "TSUGA_OTLP_ENDPOINT"
    TSUGA_OTLP_ENDPOINT: "TSUGA_OTLP_ENDPOINT"
  # If your existing secret stores the API key under a different key name, map it
  # here, e.g.
  #   keyMapping:
  #     TSUGA_API_KEY: "<API_KEY_SECRET_KEY>"

  # -- Validation settings.
  validation:
    # -- Fail the install when the Tsuga credentials the chart is about to write
    # into the secret are empty. Only applies while secret.create is true; the
    # chart cannot inspect an existing secret.
    # @default -- true
    requireMandatoryKeys: true
    # -- Mandatory keys that must be present in the secret. Currently unused: the
    # set requireMandatoryKeys checks is hardcoded in the chart's validation
    # helper, so editing this list has no effect.
    # @default -- ["TSUGA_API_KEY", "TSUGA_OTLP_ENDPOINT"]
    mandatoryKeys:
      - "TSUGA_API_KEY"
      - "TSUGA_OTLP_ENDPOINT"

# =============================================================================
# AGENT (DAEMONSET) CONFIGURATION
# =============================================================================
# The agent runs as a DaemonSet (one pod per node) and collects host metrics,
# Kubernetes objects, and application telemetry from each node.
agent:
  # -- Deploy the agent, a DaemonSet with one pod per node. It collects host
  # metrics, kubelet metrics and pod logs, and is the OTLP endpoint instrumented
  # applications send to, so turning it off removes all four.
  # @default -- true
  enabled: true
  # -- Run the agent in the host network namespace, so its OTLP ports are reachable
  # at the node's own IP. Those ports then bind on the node, so anything already
  # holding 4317 or 4318, another monitoring agent or a second collector DaemonSet,
  # makes the pod crash-loop until agent.otlp is repointed. Set it false where the
  # node network namespace is not available to pods.
  # @default -- true
  hostNetwork: true
  # -- Overrides the top-level image for the agent only.
  # @default -- ""
  image: ""
  # -- Extra environment variables for the agent. Added after the variables the
  # chart injects automatically: MY_POD_IP, NODE_IP, POD_NAME, POD_UID and
  # K8S_NODE_NAME, plus TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT while any collector
  # exports to Tsuga.
  # @default -- []
  extraEnvs: []

  # -- Address for the health_check extension, which backs the liveness probe.
  # Set to "" to omit the extension, and the liveness probe with it.
  # @default -- "${env:MY_POD_IP}:13133"
  healthCheckEndpoint: "${env:MY_POD_IP}:13133"

  # -- OTLP receiver listen addresses.
  otlp:
    # With `hostNetwork: true` these bind on the node's own IP, so they conflict
    # with anything else on the node already holding the port — another
    # monitoring agent, or a second collector DaemonSet. Change the port here if
    # that happens. Use `0.0.0.0:4317` to listen on all interfaces.
    # -- gRPC listen address. Set to "" to disable the gRPC protocol.
    # @default -- "${env:MY_POD_IP}:4317"
    grpcEndpoint: "${env:MY_POD_IP}:4317"
    # -- HTTP listen address. Set to "" to disable the HTTP protocol. Emptying both
    # endpoints leaves the otlp receiver with no protocol, which the collector
    # rejects at startup.
    # @default -- "${env:MY_POD_IP}:4318"
    httpEndpoint: "${env:MY_POD_IP}:4318"

  # -- Collect logs from the host and containers.
  # When true, enables the file_log receiver to collect logs from /var/log/pods.
  # Also mounts required volumes for log collection.
  # @default -- true
  collectLogs: true

  # -- Collect OpenTelemetry collector logs.
  # When false (default), excludes the collector's own container logs to avoid a
  # self-ingestion feedback loop that produces container-parser errors.
  # @default -- false
  collectOtelLogs: false

  # -- Collect host network metrics.
  # When true, enables network scraper in the host_metrics receiver.
  # @default -- false
  collectNetwork: false

  # Reports every process on the node. A few per-process details the agent has no
  # access to, such as the executable path and owner, are left off.
  # -- Collect host processes metrics.
  # When true, enables processes and process scrapers in the host_metrics receiver.
  # @default -- false
  collectProcesses: false

  # -- Mount the /var/log/pods and /var/lib/docker/containers hostPaths even when
  # collectLogs is false. Has no effect while collectLogs is true, which already
  # mounts them.
  # @default -- true
  addLogsVolumes: true

  # -- file_log receiver paths (used when collectLogs is true).
  fileLog:
    # -- Log file globs to read.
    # @default -- ["/var/log/pods/*/*/*.log"]
    include:
      - /var/log/pods/*/*/*.log
    # Narrowing this is the single biggest log-cost lever in the chart: excluding
    # a noisy namespace, e.g. `/var/log/pods/kube-system_*/*/*.log`, drops those
    # records before they are ever read. The collector's own logs are excluded
    # separately, via collectOtelLogs.
    # -- Log file globs to skip. Narrowing this is the biggest log-cost lever in the
    # chart: excluding a noisy namespace, e.g. `/var/log/pods/kube-system_*/*/*.log`,
    # drops those records before they are ever read.
    # @default -- []
    exclude: []

  # -- host_metrics receiver options.
  # @default -- see values.yaml
  hostMetrics:
    # Datapoint volume scales inversely with this, across every node in the
    # cluster, so 10s costs six times what 60s does.
    # -- How often to collect host metrics, e.g. `60s`. Datapoint volume scales
    # inversely, so 60s costs a sixth of 10s.
    # @default -- "10s"
    collectionInterval: 10s

    # `network`, `process` and `processes` are rendered only when
    # agent.collectNetwork / agent.collectProcesses are true. Emptying the map
    # fails the render: the receiver requires at least one scraper.
    #
    # Every metric enabled below is off in the receiver's own defaults. The four
    # utilization ratios carry the same attributes as a counter that is already on,
    # so they add no series; system.memory.limit, system.linux.memory.available and
    # the two conntrack gauges each add one series per node.
    # -- host_metrics scrapers, rendered verbatim into the receiver config. Setting
    # a scraper to `null` drops it. See the
    # [receiver docs](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/hostmetricsreceiver/README.md)
    # for the options each scraper accepts.
    # @default -- see values.yaml
    scrapers: # @schema skipProperties: true
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        # Without these every container overlay mount and kernel pseudo filesystem
        # on the node becomes its own series, which on a busy node is dozens per pod
        # and tells you nothing. fs_types is Prometheus node_exporter's
        # defFSTypesExcluded set, verbatim; mount_points is its
        # defMountPointsExcluded set plus /var/lib/kubelet and /run/k3s/containerd.
        #
        # Matched unanchored against the host's own mount point, not the path seen
        # through root_path, so the patterns carry no /hostfs prefix. The `/.+` ones
        # therefore exclude what is mounted *under* those paths and keep the path
        # itself, so a dedicated image or ephemeral-storage volume still reports.
        # tmpfs is deliberately kept, as
        # node_exporter keeps it too: /run and friends are real usage worth watching.
        exclude_mount_points:
          match_type: regexp
          mount_points:
            - '^/dev($|/)'
            - '^/proc($|/)'
            - '^/run/credentials/.+'
            - '^/run/k3s/containerd/.+'
            - '^/sys($|/)'
            - '^/var/lib/containers/storage/.+'
            - '^/var/lib/docker/.+'
            - '^/var/lib/kubelet/.+'
        exclude_fs_types:
          match_type: strict
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - erofs
            - fusectl
            - hugetlbfs
            - iso9660
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tracefs
      load: {}
      memory:
        metrics:
          # MemAvailable from /proc/meminfo, which is what the kernel's own OOM
          # accounting tracks. system.memory.usage{state=free} is not a substitute:
          # it excludes reclaimable page cache, so it reads low on a warm node.
          system.linux.memory.available:
            enabled: true
          system.memory.limit:
            enabled: true
          system.memory.utilization:
            enabled: true
      network:
        metrics:
          # A full conntrack table drops connections node-wide and shows up in
          # applications only as unexplained timeouts. Two series per node.
          #
          # There is no mute flag for this scraper: on a node without
          # /proc/sys/net/netfilter/nf_conntrack_* — Cilium with kube-proxy
          # replacement, GKE Dataplane V2 — the scraper logs a read error every
          # collection interval instead. Set these to false there.
          system.network.conntrack.count:
            enabled: true
          system.network.conntrack.max:
            enabled: true
      paging:
        metrics:
          system.paging.utilization:
            enabled: true
      process:
        # Best effort: the agent reports the processes it can read on the node, and
        # per-process details it has no access to are left off rather than logged
        # once per process per scrape.
        mute_process_all_errors: true
        resource_attributes:
          # Emitted unconditionally, so it would be an empty string on every
          # process whose exe symlink the agent cannot read. command_line carries
          # the same information.
          process.executable.path:
            enabled: false
        metrics:
          process.uptime:
            enabled: true
      processes: {}

  # -- kubelet_stats receiver options.
  kubeletStats:
    # -- How often to collect kubelet metrics, e.g. `60s`. Datapoint volume scales
    # inversely, so 60s costs a sixth of 10s.
    # @default -- "20s"
    collectionInterval: 20s
    # -- Kubelet authentication method. One of `serviceAccount`, `tls`, `kubeConfig`, `none`.
    # @default -- "serviceAccount"
    authType: serviceAccount
    # Kubelets normally serve a self-signed certificate, which is why this
    # defaults to true. Set it to false and supply caFile where policy requires
    # the kubelet's serving certificate to be verified.
    # -- Skip verification of the kubelet's serving certificate.
    # @default -- true
    insecureSkipVerify: true
    # -- CA bundle path used to verify the kubelet, e.g.
    # `/var/run/secrets/kubernetes.io/serviceaccount/ca.crt`. Requires
    # insecureSkipVerify to be false, and the file to be mounted in the pod.
    # @default -- ""
    caFile: ""
    # container adds eleven default-on metrics per container and volume five per
    # volume, so this is the knob for kubelet metric cardinality. node and pod are
    # the minimum useful set. Note the receiver's own default omits volume; this
    # chart enables it.
    # -- Kubelet metric groups to collect. Any of `node`, `pod`, `container`,
    # `volume`. node and pod are the minimum useful set; container adds eleven
    # metrics per container and volume five per volume, so those two drive kubelet
    # metric cardinality.
    # @default -- [node, pod, container, volume]
    metricGroups:
      - node
      - pod
      - container
      - volume

    # The receiver calls the kubelet /pods endpoint, on top of /stats/summary,
    # whenever volume type labels or any limit/request utilization metric are
    # requested. If that call fails it discards the ENTIRE scrape for the
    # interval — node and pod metrics included, not just the attributes it could
    # not resolve.
    #
    # /pods authorizes against the nodes/proxy subresource, which this chart's
    # ClusterRole grants. GKE Autopilot does not allow nodes/proxy to be granted
    # at all, so on Autopilot this MUST be false or every scrape is lost.
    #
    # Setting it to false costs the volume type labels and all eight
    # limit/request utilization metrics — including the ratios alerts are
    # usually written on. Node, pod, container and volume metrics are unaffected;
    # they come from /stats/summary alone.
    #
    # -- Use the kubelet /pods endpoint for pod metadata. It is what supplies the
    # volume type labels and the eight limit/request utilization metrics, and it
    # authorizes against the nodes/proxy subresource: a failing call discards the
    # whole scrape, not just those attributes, so set this false on clusters that
    # cannot grant nodes/proxy, GKE Autopilot in particular.
    # @default -- true
    usePodsEndpoint: true

  # -- span_metrics connector options (RED metrics generated from spans).
  spanMetrics:
    # -- Generate request count and duration metrics from spans, one series per
    # service and per combination of the dimensions below. Disabling it removes
    # those metrics; the spans themselves are unaffected.
    # @default -- true
    enabled: true
    # `http.route` is a route template in frameworks that expose one, and a raw
    # path in those that do not (Express, raw net/http, some gRPC gateways) —
    # where it becomes unbounded, one histogram set per distinct URL. Drop it if
    # your services cannot template routes.
    # -- Span attributes to keep as metric dimensions. `default` supplies a value
    # when the attribute is absent.
    # @default -- see values.yaml
    dimensions:
      - name: http.request.method
        default: GET
      - name: http.response.status_code
      - name: http.route

  # -- Replace default config with complete custom configuration.
  # When set, this completely replaces the default collector configuration.
  # Use this for full control over the OpenTelemetry Collector config
  # See cluster.customConfig for example format.
  # @default -- {}
  customConfig: {}
  # -- Agent collector configuration (merge-based approach).
  # Use this to extend the default configuration.
  # Default receivers: file_log (when agent.collectLogs), kubelet_stats, host_metrics, otlp.
  # Default processors: memory_limiter, cumulative_to_delta, resource_detection
  # (when resourceDetection.enabled), k8s_attributes, resource, resource/node,
  # batch.
  # Default connectors: span_metrics (when agent.spanMetrics.enabled).
  # Default extensions: health_check (when agent.healthCheckEndpoint is set).
  config:
    # -- Additional receivers to merge into the collector configuration.
    # These are merged with default receivers.
    # @default -- {}
    extraReceivers: {}
    # -- Additional processors to merge into the collector configuration.
    # These are merged with default processors.
    # @default -- {}
    extraProcessors: {}
    # -- Additional exporters to merge into the collector configuration.
    # These are merged with default exporters (otlp_http/tsuga).
    # @default -- {}
    extraExporters: {}
    # -- Additional extensions to merge into the collector configuration.
    # These are merged with the default health_check extension, which is present
    # only when agent.healthCheckEndpoint is set.
    # @default -- {}
    extraExtensions: {}
    # -- Additional connectors to merge into the collector configuration.
    # These are merged with default connectors.
    # @default -- {}
    extraConnectors: {}
    # Service configuration
    service:
      # -- Additional extensions to add to the service configuration.
      # Added after the default health_check extension, which is present only
      # when agent.healthCheckEndpoint is set.
      # @default -- []
      extraExtensions: []
      # Pipeline configuration
      pipelines:
        # Logs pipeline configuration
        logs:
          # -- Additional exporters to add to the logs pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the logs pipeline.
          # Added to default processors (memory_limiter, k8s_attributes, resource, resource/node, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the logs pipeline.
          # Added to default receivers (otlp, file_log).
          # @default -- []
          extraReceivers: []
        # Metrics pipeline configuration
        metrics:
          # -- Additional exporters to add to the metrics pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the metrics pipeline.
          # Added to default processors (memory_limiter, cumulative_to_delta, k8s_attributes, resource, resource/node, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the metrics pipeline.
          # Added to default receivers (otlp, kubelet_stats, span_metrics, host_metrics).
          # @default -- []
          extraReceivers: []
        # Traces pipeline configuration
        traces:
          # -- Additional exporters to add to the traces pipeline.
          # Added to default exporters (otlp_http/tsuga, span_metrics).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the traces pipeline.
          # Added to default processors (memory_limiter, k8s_attributes, resource, resource/node, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the traces pipeline.
          # Added to default receivers (otlp).
          # @default -- []
          extraReceivers: []
        # -- Additional pipelines to add to the service configuration.
        # These are completely new pipelines, not extensions of the default ones.
        # @default -- {}
        extraPipelines: {}
  # -- Label mapping configuration for agent.
  # Maps Kubernetes pod labels to OpenTelemetry resource attributes.
  # These are appended to default label mappings.
  # Format: List of objects with tag_name, key, and from fields, where from is one
  # of `pod`, `namespace`, `node`, `deployment`, `statefulset`, `daemonset`, `job`
  # and defaults to `pod`.
  # @default -- []
  extraLabelMapping: []
  #   - tag_name: "app.version"
  #     key: "app.version"
  #     from: "pod"

  # -- Annotations mapping configuration for agent.
  # Maps Kubernetes pod annotations to OpenTelemetry resource attributes.
  # These are appended to default annotation mappings.
  # Same shape as agent.extraLabelMapping.
  # @default -- []
  extraAnnotationsMapping: []
  # The agent's k8s_attributes cache is scoped to its own node
  # (filter.node_from_env_var), so its memory tracks pods per node, not cluster
  # size. The default holds on clusters of any size. Raise it for nodes packed
  # well beyond the usual pod count, or for workloads with heavy log volume.
  #
  #   resources:
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi
  #     requests:
  #       cpu: 100m
  #       memory: 128Mi
  #
  # -- Resource limits and requests for the agent. Replaces the top-level
  # resources block wholesale rather than merging, so a partial override drops
  # whatever it does not restate.
  # @default -- {}
  resources: {}
  # -- Agent-specific node selector.
  # If not set, inherits from global nodeSelector configuration.
  # @default -- {}
  nodeSelector: {}
  # -- Agent-specific tolerations.
  # If not set, inherits from global tolerations configuration.
  # @default -- []
  tolerations: []
  # -- Agent-specific affinity rules.
  # If not set, inherits from global affinity configuration.
  # @default -- {}
  affinity: {}

# =============================================================================
# CLUSTER RECEIVER CONFIGURATION
# =============================================================================
# The cluster receiver runs as a Deployment and collects Kubernetes cluster-level
# metrics and events.
# Recommended: Deploy both agent (DaemonSet) and cluster receiver (Deployment)
cluster:
  # -- Deploy the cluster receiver, a single-replica Deployment that reads
  # cluster-level metrics, pod objects and Warning events from the API server. The
  # agent collects none of those, so turning it off loses them.
  # @default -- true
  enabled: true
  # -- Overrides the top-level image for the cluster receiver only.
  # @default -- ""
  image: ""
  # -- Extra environment variables for the cluster receiver. Added after the
  # variables the chart injects automatically: MY_POD_IP, NODE_IP, POD_NAME,
  # POD_UID and K8S_NODE_NAME, plus TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT while
  # any collector exports to Tsuga.
  # @default -- []
  extraEnvs: []
  #   - name: CUSTOM_VAR
  #     value: "custom-value"

  # -- Address for the health_check extension, which backs the liveness probe.
  # Set to "" to omit the extension, and the liveness probe with it.
  # @default -- "${env:MY_POD_IP}:13133"
  healthCheckEndpoint: "${env:MY_POD_IP}:13133"
  # -- Watch pod objects and send them as logs. Powers the Kubernetes view, which
  # uses them to show pod configuration. Costs one log record per pod change, plus a
  # full snapshot of every pod on each collector restart.
  # @default -- true
  collectk8sobjects: true
  # Worth enabling. Events are the only source for OOMKilled, FailedScheduling,
  # Evicted, ErrImagePull, FailedMount and failing probes — no metric receiver
  # reports them, and RBAC for events is already granted so this costs no extra
  # configuration.
  #
  # Off by default because the log volume follows cluster health, which is not
  # something an upgrade should turn on for you.
  #
  # Only Warning events are collected, filtered by field_selector at the API
  # server, so Normal events are never watched or transferred. They are the
  # high-volume, low-value majority and largely restate what the pods object
  # stream already carries.
  #
  # -- Collect Kubernetes Warning events as logs. Events are the only source for
  # OOMKilled, FailedScheduling, Evicted, ErrImagePull, FailedMount and failing
  # probes, since no metric receiver reports them. Off by default because the volume
  # follows cluster health. Only Warning events are collected, filtered at the API
  # server, so Normal events are never transferred.
  # @default -- false
  collectk8sevents: false
  # Datapoint volume scales inversely with this: every object in the informer
  # cache is re-reported on each pass, so 10s produces six times the datapoints
  # of 60s. Raise it to cut ingest on large clusters.
  # -- How often to collect cluster metrics, e.g. `30s`. Datapoint volume scales
  # inversely, so 60s costs a sixth of 10s.
  # @default -- "10s"
  collectionInterval: 10s
  # -- Node conditions reported as metrics. Any condition type works, so
  # `NetworkUnavailable` or the custom conditions node-problem-detector writes can be
  # added. A name no node reports emits a permanent -1 gauge rather than nothing, so
  # check the spelling.
  # @default -- [Ready, MemoryPressure, DiskPressure, PIDPressure]
  nodeConditionsToReport:
    - Ready
    - MemoryPressure
    - DiskPressure
    - PIDPressure
  # Any other key in the node's status.allocatable also works, e.g. hugepages-2Mi.
  # -- Names from the node's `status.allocatable`, such as `cpu`, `memory`,
  # `ephemeral-storage` and `pods`. A name the node does not report, `storage` for
  # example, is skipped silently.
  # @default -- [cpu, memory, ephemeral-storage]
  allocatableTypesToReport:
    - cpu
    - memory
    - ephemeral-storage
  # -- Replace default config with complete custom configuration.
  # When set, this completely replaces the default collector configuration.
  # Use this for full control over the OpenTelemetry Collector config.
  # @default -- {}
  customConfig: {}
  #   receivers:
  #     k8s_cluster:
  #       collection_interval: 30s
  #   processors:
  #     batch: {}
  #   exporters:
  #     otlp_http/tsuga:
  #       endpoint: ${TSUGA_OTLP_ENDPOINT}
  #   service:
  #     pipelines:
  #       metrics:
  #         receivers: [k8s_cluster]
  #         processors: [batch]
  #         exporters: [otlp_http/tsuga]

  # -- Cluster receiver configuration (merge-based approach).
  # Use this to extend the default configuration.
  # Default receivers: k8s_cluster, k8s_objects (when cluster.collectk8sobjects),
  # k8s_objects/events (when cluster.collectk8sevents).
  # Default processors: memory_limiter, batch, resource_detection (when
  # resourceDetection.enabled), transform/k8s_event_severity (when
  # cluster.collectk8sevents), k8s_attributes, resource.
  # Default extensions: health_check (when cluster.healthCheckEndpoint is set).
  config:
    # -- Additional receivers to merge into the collector configuration.
    # These are merged with default receivers (k8s_cluster, plus k8s_objects when
    # cluster.collectk8sobjects and k8s_objects/events when cluster.collectk8sevents).
    # @default -- {}
    extraReceivers: {}
    #   prometheus:
    #     config:
    #       scrape_configs:
    #         - job_name: 'my-service'

    # -- Additional processors to merge into the collector configuration.
    # These are merged with default processors (memory_limiter, batch,
    # k8s_attributes, resource, plus resource_detection when
    # resourceDetection.enabled and transform/k8s_event_severity when
    # cluster.collectk8sevents).
    # @default -- {}
    extraProcessors: {}
    # -- Additional exporters to merge into the collector configuration.
    # These are merged with default exporters (otlp_http/tsuga).
    # @default -- {}
    extraExporters: {}
    # -- Additional connectors to merge into the collector configuration.
    # These are merged with default connectors.
    # @default -- {}
    extraConnectors: {}
    # Service configuration
    service:
      # -- Additional extensions to add to the service configuration.
      # Added after the default health_check extension, which is present only
      # when cluster.healthCheckEndpoint is set.
      # @default -- []
      extraExtensions: []
      # Pipeline configuration
      pipelines:
        # -- Logs pipeline configuration (Kubernetes entity events).
        logs:
          # -- Additional exporters to add to the logs pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the logs pipeline.
          # Added to default processors (memory_limiter, k8s_attributes, resource, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the logs pipeline.
          # Added to default receivers (k8s_cluster, plus k8s_objects when
          # cluster.collectk8sobjects).
          # @default -- []
          extraReceivers: []
        # Metrics pipeline configuration
        metrics:
          # -- Additional exporters to add to the metrics pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the metrics pipeline.
          # Added to default processors (memory_limiter, k8s_attributes, resource, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the metrics pipeline.
          # Added to default receiver (k8s_cluster).
          # @default -- []
          extraReceivers: []
        # -- Additional pipelines to add to the service configuration.
        # These are completely new pipelines, not extensions of the default ones.
        # @default -- {}
        extraPipelines: {}
        #   custom-logs:
        #     receivers: [custom-receiver]
        #     processors: [batch]
        #     exporters: [custom-exporter]

  # -- Label mapping configuration for the cluster receiver.
  # Maps Kubernetes pod labels to OpenTelemetry resource attributes.
  # These are appended to default label mappings.
  # Same shape as agent.extraLabelMapping.
  # @default -- []
  extraLabelMapping: []
  # -- Annotations mapping configuration for the cluster receiver.
  # Maps Kubernetes pod annotations to OpenTelemetry resource attributes.
  # These are appended to default annotation mappings.
  # Same shape as agent.extraLabelMapping.
  # @default -- []
  extraAnnotationsMapping: []
  # Raise this collector as the cluster grows. It runs a single replica by
  # design, so it cannot be scaled out, and its memory grows with the number of
  # objects in the cluster: k8s_cluster watches every object, and its
  # k8s_attributes cache is cluster-wide rather than node-scoped like the
  # agent's. Left at the default, it will OOMKill on a large cluster.
  #
  # Sizing by cluster:
  #   up to  50 nodes   cpu 500m, memory 512Mi  (the default)
  #   up to 100 nodes   cpu 1,    memory 2Gi
  #   up to 250 nodes   cpu 2,    memory 4Gi
  #
  #   resources:
  #     limits:
  #       cpu: 1
  #       memory: 2Gi
  #     requests:
  #       cpu: 200m
  #       memory: 512Mi
  #
  # Object count drives memory more than node count does, so a cluster dense in
  # pods, jobs or events needs the next tier up. Watch this pod's
  # container_memory_working_set_bytes and otelcol_processor_refused_* counters,
  # and raise the limit until both settle.
  # -- Resource limits and requests for the cluster receiver. Replaces the top-level
  # resources block wholesale rather than merging, so a partial override drops
  # whatever it does not restate.
  # @default -- {}
  resources: {}
  # -- Cluster-specific node selector.
  # If not set, inherits from global nodeSelector configuration.
  # @default -- {}
  nodeSelector: {}
  # -- Cluster-specific tolerations.
  # If not set, inherits from global tolerations configuration.
  # @default -- []
  tolerations: []
  # -- Cluster-specific affinity rules.
  # If not set, inherits from global affinity configuration.
  # @default -- {}
  affinity: {}

# =============================================================================
# TARGET ALLOCATOR CONFIGURATION
# =============================================================================
# The Target Allocator decouples Prometheus service discovery from metric
# collection. When enabled, it deploys a TargetAllocator CR and a paired
# StatefulSet OpenTelemetryCollector CR.
# Requires the OpenTelemetry Operator to be installed.
targetAllocator:
  # -- Enable Target Allocator and paired StatefulSet collector.
  # @default -- false
  enabled: false
  # -- TargetAllocator CR spec (full passthrough)
  # All fields are passed directly to the TargetAllocator CR spec. Setting
  # spec.serviceAccount here overrides the account the chart would otherwise set.
  # Ref: https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/api.md#targetallocator
  # @default -- {}
  spec:
    # -- How the Target Allocator spreads targets across collector replicas. One of
    # `consistent-hashing`, `least-weighted`, `per-node`. per-node assigns only
    # targets that resolve to a node, so anything else is left unscraped.
    # @default -- "consistent-hashing"
    allocationStrategy: consistent-hashing
    # -- PrometheusCR configuration.
    # When enabled, the Target Allocator discovers ServiceMonitor and PodMonitor CRs.
    # Requires monitoring.coreos.com RBAC rules (added automatically when enabled).
    prometheusCR:
      # -- Enable ServiceMonitor/PodMonitor discovery.
      # @default -- false
      enabled: false
      # -- Selector for ServiceMonitor resources
      # An empty selector ({}) matches all ServiceMonitors in all namespaces.
      # @default -- {}
      serviceMonitorSelector: {}
      # -- Selector for PodMonitor resources
      # An empty selector ({}) matches all PodMonitors in all namespaces.
      # @default -- {}
      podMonitorSelector: {}

# =============================================================================
# STATEFULSET COLLECTOR CONFIGURATION
# =============================================================================
# The StatefulSet collector is deployed alongside the TargetAllocator.
# It is only created when targetAllocator.enabled is true.
statefulset:
  # -- Number of StatefulSet collector replicas
  # The Target Allocator distributes targets across replicas according to
  # targetAllocator.spec.allocationStrategy.
  # @default -- 1
  replicas: 1
  # -- Overrides the top-level image for the StatefulSet collector only.
  # @default -- ""
  image: ""
  # -- Extra environment variables for the StatefulSet collector. Added after the
  # variables the chart injects automatically: MY_POD_IP, NODE_IP, POD_NAME,
  # POD_UID and K8S_NODE_NAME, plus TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT while
  # any collector exports to Tsuga.
  # @default -- []
  extraEnvs: []
  # -- Address for the health_check extension, which backs the liveness probe.
  # Set to "" to omit the extension, and the liveness probe with it.
  # @default -- "${env:MY_POD_IP}:13133"
  healthCheckEndpoint: "${env:MY_POD_IP}:13133"
  # -- How often to scrape Prometheus targets, e.g. `60s`. Also the interval at
  # which the collector refreshes its target list from the Target Allocator.
  # @default -- "30s"
  scrapeInterval: 30s
  # -- Replace default config with complete custom configuration.
  # When set, this completely replaces the default collector configuration
  # See cluster.customConfig for example format.
  # @default -- {}
  customConfig: {}
  # -- StatefulSet collector configuration (merge-based approach).
  # Use this to extend the default configuration.
  # Default receivers: prometheus.
  # Default processors: memory_limiter, batch, cumulative_to_delta,
  # resource_detection (when resourceDetection.enabled), k8s_attributes, resource.
  # Default extensions: health_check (when statefulset.healthCheckEndpoint is set).
  config:
    # -- Additional receivers to merge into the collector configuration.
    # These are merged with the default receiver (prometheus).
    # @default -- {}
    extraReceivers: {}
    # -- Additional processors to merge into the collector configuration.
    # These are merged with default processors (memory_limiter, batch,
    # cumulative_to_delta, k8s_attributes, resource).
    # @default -- {}
    extraProcessors: {}
    # -- Additional exporters to merge into the collector configuration.
    # These are merged with the default exporter (otlp_http/tsuga).
    # @default -- {}
    extraExporters: {}
    # -- Additional connectors to merge into the collector configuration
    # The default config defines no connectors.
    # @default -- {}
    extraConnectors: {}
    # Service configuration
    service:
      # -- Additional extensions to add to the service configuration.
      # Added after the default health_check extension, which is present only
      # when statefulset.healthCheckEndpoint is set.
      # @default -- []
      extraExtensions: []
      # Pipeline configuration
      pipelines:
        # Metrics pipeline configuration
        metrics:
          # -- Additional exporters to add to the metrics pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the metrics pipeline.
          # Added to default processors (memory_limiter, cumulative_to_delta, k8s_attributes, resource, batch).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the metrics pipeline.
          # Added to default receiver (prometheus).
          # @default -- []
          extraReceivers: []
        # -- Additional pipelines to add to the service configuration.
        # These are completely new pipelines, not extensions of the default ones.
        # @default -- {}
        extraPipelines: {}
  # -- Label mapping configuration for the StatefulSet collector.
  # Maps Kubernetes pod labels to OpenTelemetry resource attributes.
  # These are appended to default label mappings.
  # Same shape as agent.extraLabelMapping.
  # @default -- []
  extraLabelMapping: []
  # -- Annotations mapping configuration for the StatefulSet collector.
  # Maps Kubernetes pod annotations to OpenTelemetry resource attributes.
  # These are appended to default annotation mappings.
  # Same shape as agent.extraLabelMapping.
  # @default -- []
  extraAnnotationsMapping: []
  # Sized by throughput, not cluster size: this is a gateway, so what matters is
  # how much telemetry the collectors in front of it forward. Scale it out with
  # replicas rather than up, and keep roughly 1 cpu per 2Gi of memory. Budget one
  # cpu per 15k spans/s, 20k metric datapoints/s or 10k log records/s.
  #
  #   resources:
  #     limits:
  #       cpu: 2
  #       memory: 4Gi
  #     requests:
  #       cpu: 500m
  #       memory: 1Gi
  #
  # -- Resource limits and requests for the StatefulSet collector. Replaces the top-level
  # resources block wholesale rather than merging, so a partial override drops
  # whatever it does not restate.
  # @default -- {}
  resources: {}
  # -- StatefulSet-specific node selector.
  # If not set, inherits from global nodeSelector configuration.
  # @default -- {}
  nodeSelector: {}
  # -- StatefulSet-specific tolerations.
  # If not set, inherits from global tolerations configuration.
  # @default -- []
  tolerations: []
  # -- StatefulSet-specific affinity rules.
  # If not set, inherits from global affinity configuration.
  # @default -- {}
  affinity: {}

# =============================================================================
# PROFILING (eBPF) CONFIGURATION
# =============================================================================
# Whole-cluster CPU profiles with no application changes: no SDK, no
# re-instrumentation, no restart of the profiled workloads. A separate
# privileged DaemonSet samples every process on the node from the outside and
# exports OTLP profiles to Tsuga.
#
# It is its own collector, not a pipeline on the agent, for two reasons: the
# profiling receiver only exists in the ebpf-profiler distro (the contrib image
# the agent runs does not have it), and it needs privileged + hostPID, which
# the agent does not.
#
# Before enabling:
#   1. The release namespace must admit privileged pods. A namespace at
#      `restricted` rejects this DaemonSet outright:
#        kubectl label ns <namespace> pod-security.kubernetes.io/enforce=privileged
#   2. Nodes need a kernel of 5.10 or newer (the receiver refuses to start
#      below that) with debugfs/tracefs available. AL2023 is the safe default;
#      Bottlerocket restricts the host paths this mounts and is unverified.
#
# The shared resourceDetection block is not wired into this collector, whatever
# resourceDetection.enabled says. Add it yourself if you want cloud and host
# attributes on profiles:
#
#   profiling:
#     config:
#       extraProcessors:
#         resource_detection:
#           detectors: [env, eks]
#       service:
#         pipelines:
#           profiles:
#             extraProcessors: [resource_detection]
profiling:
  # -- Deploy the eBPF profiling collector, a privileged DaemonSet with one pod
  # per node. Off by default: it runs privileged with hostPID on every node,
  # which is a security posture change, and it samples every process on every
  # node.
  # @default -- false
  enabled: false

  # Deliberately separate from the top-level `image`: the profiling receiver
  # ships only in the ebpf-profiler distro, so the contrib image the other
  # collectors run cannot serve this one. Pinned, and multi-arch (amd64 and
  # arm64), so Graviton and x86 node groups both resolve.
  # -- Collector image for the profiling DaemonSet. Must be a distro carrying the
  # `profiling` receiver, which contrib is not.
  # @default -- see values.yaml
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-ebpf-profiler:0.157.0

  # The rate is not carried on the exported profile, so it cannot be recovered at
  # read time: Tsuga's UI assumes 20 Hz when converting samples into CPU time,
  # and any other value makes every derived CPU figure wrong by exactly
  # rate / 20. Change it only alongside that assumption.
  # -- Sampling frequency in Hz. Leave at 20: Tsuga converts samples to CPU time
  # assuming 20 Hz, and the rate is not recoverable from the exported profile.
  # @default -- 20
  samplesPerSecond: 20

  # eBPF has no SDK to ask, so nothing sets service.name for a profiled process.
  # The chart resolves it in two tiers: this environment variable is read off the
  # profiled process and promoted to service.name, and whatever it does not cover
  # falls through to k8s_attributes, which implements the OTel Kubernetes
  # service.name precedence (app.kubernetes.io/instance and .../name labels, then
  # the owner-kind ancestor chain). Tier one is the one that makes profiles join
  # to traces and logs on an identical service.name, so prefer setting the
  # variable on your workloads.
  #
  # One variable, by construction: this is the name the receiver is told to
  # surface and the name the transform promotes, so the two cannot disagree.
  # Surfacing more of a process's environment means overriding the receiver
  # yourself through profiling.customConfig.
  # -- Environment variable read from each profiled process and promoted to
  # service.name. Set to "" to rely on Kubernetes metadata alone.
  # @default -- "OTEL_SERVICE_NAME"
  serviceNameEnvVar: OTEL_SERVICE_NAME

  # Narrower than the other collectors' k8sAttributes.metadata, and only because
  # this is what a profile is grouped and filtered by in practice — workload and
  # container, not individual pod. The pod-scoped attributes are a reasonable
  # addition if you want to pin a flame graph to one pod; they are left out of
  # the default rather than forbidden.
  #
  # service.name and service.version are what activate the processor's own
  # implementation of the OTel Kubernetes service precedence — see
  # opentelemetry-kube-stack.k8sAttributesMetadata in _config.tpl.
  # -- Kubernetes metadata k8s_attributes attaches to profiles.
  # @default -- see values.yaml
  k8sAttributesMetadata:
    - k8s.namespace.name
    - k8s.deployment.name
    - k8s.statefulset.name
    - k8s.daemonset.name
    - k8s.container.name
    - service.name
    - service.version

  # -- Address for the health_check extension, which backs the liveness probe.
  # Set to "" to omit the extension, and the liveness probe with it.
  # @default -- "${env:MY_POD_IP}:13133"
  healthCheckEndpoint: "${env:MY_POD_IP}:13133"

  # -- Extra environment variables for the profiling collector. Added after the
  # variables the chart injects automatically: MY_POD_IP, NODE_IP, POD_NAME,
  # POD_UID and K8S_NODE_NAME, plus TSUGA_API_KEY and TSUGA_OTLP_ENDPOINT while
  # any collector exports to Tsuga.
  # @default -- []
  extraEnvs: []

  # Overhead at 20 Hz is low but non-zero, and scales with core count per node,
  # so a limit that fits a 4-core node can throttle the profiler on a 64-core
  # one. The defaults follow upstream's own DaemonSet example.
  # -- Resource limits and requests for the profiling collector. Replaces the
  # top-level resources block wholesale rather than merging.
  # @default -- see values.yaml
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # -- Profiling-specific node selector.
  # If not set, inherits from global nodeSelector configuration.
  # @default -- {}
  nodeSelector: {}
  # -- Profiling-specific tolerations.
  # If not set, inherits from global tolerations configuration. A node the
  # profiler does not tolerate is simply not profiled.
  # @default -- []
  tolerations: []
  # -- Profiling-specific affinity rules.
  # If not set, inherits from global affinity configuration.
  # @default -- {}
  affinity: {}

  # -- Replace default config with complete custom configuration.
  # When set, this completely replaces the default collector configuration.
  # See cluster.customConfig for example format.
  # @default -- {}
  customConfig: {}
  # -- Profiling collector configuration (merge-based approach).
  # Use this to extend the default configuration.
  # Default receivers: profiling.
  # Default processors: memory_limiter, transform/service_name (when
  # profiling.serviceNameEnvVar is set), k8s_attributes, resource.
  # Default extensions: health_check (when profiling.healthCheckEndpoint is set).
  #
  # Note that `batch` is absent on purpose: the batch processor supports traces,
  # metrics and logs only, and a profiles pipeline referencing it fails to start.
  # The receiver emits on its own reporter interval instead.
  config:
    # -- Additional receivers to merge into the collector configuration.
    # These are merged with default receivers.
    # @default -- {}
    extraReceivers: {}
    # -- Additional processors to merge into the collector configuration.
    # These are merged with default processors.
    # @default -- {}
    extraProcessors: {}
    # -- Additional exporters to merge into the collector configuration.
    # These are merged with default exporters (otlp_http/tsuga).
    # @default -- {}
    extraExporters: {}
    # -- Additional extensions to merge into the collector configuration.
    # These are merged with the default health_check extension, which is present
    # only when profiling.healthCheckEndpoint is set.
    # @default -- {}
    extraExtensions: {}
    # -- Additional connectors to merge into the collector configuration.
    # @default -- {}
    extraConnectors: {}
    # Service configuration
    service:
      # -- Additional extensions to add to the service configuration.
      # Added after the default health_check extension, which is present only
      # when profiling.healthCheckEndpoint is set.
      # @default -- []
      extraExtensions: []
      # Pipeline configuration
      pipelines:
        # Profiles pipeline configuration
        profiles:
          # -- Additional exporters to add to the profiles pipeline.
          # Added to default exporter (otlp_http/tsuga).
          # @default -- []
          extraExporters: []
          # -- Additional processors to add to the profiles pipeline.
          # Added to default processors (memory_limiter, transform/service_name,
          # k8s_attributes, resource).
          # @default -- []
          extraProcessors: []
          # -- Additional receivers to add to the profiles pipeline.
          # Added to default receiver (profiling).
          # @default -- []
          extraReceivers: []
        # -- Additional pipelines to add to the service configuration.
        # These are completely new pipelines, not extensions of the default one.
        # @default -- {}
        extraPipelines: {}

# =============================================================================
# AUTO-INSTRUMENTATION (APM) CONFIGURATION
# =============================================================================
# This creates an OpenTelemetry Operator `Instrumentation` resource.
# Workloads can then opt-in via pod annotations like:
#   instrumentation.opentelemetry.io/inject-java: "true"
#   instrumentation.opentelemetry.io/inject-python: "true"
#   instrumentation.opentelemetry.io/inject-nodejs: "true"
#   instrumentation.opentelemetry.io/inject-dotnet: "true"
autoInstrumentation:
  # -- Enable OpenTelemetry Operator auto-instrumentation (Instrumentation CR).
  # Requires the OpenTelemetry Operator to be installed in the cluster.
  # @default -- false
  enabled: false

  # -- apiVersion for the Instrumentation CR. The CR is v1alpha1 on current
  # operator releases.
  # @default -- "opentelemetry.io/v1alpha1"
  apiVersion: "opentelemetry.io/v1alpha1"

  # -- Override the name of the Instrumentation resource.
  # If empty, defaults to "<release-fullname>-instrumentation".
  # @default -- ""
  nameOverride: ""

  # -- Extra labels to add to the Instrumentation resource.
  # @default -- {}
  labels: {}
  # -- Extra annotations to add to the Instrumentation resource.
  # @default -- {}
  annotations: {}
  # -- Instrumentation spec (full passthrough).
  # This is passed directly to the Instrumentation Custom Resource spec.
  # It can include, among others, exporter, propagators, sampler, env, resource, and language
  # blocks such as java, nodejs, python, dotnet, go and apacheHttpd. The empty
  # default creates an Instrumentation with no exporter endpoint, so set
  # spec.exporter.endpoint to the agent's OTLP address before annotating a workload.
  # Ref: https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/api.md#instrumentation
  # @default -- {}
  spec: {}

# =============================================================================
# SHARED PROCESSOR CONFIGURATION
# =============================================================================
# Applies to all three collectors (agent, cluster receiver, StatefulSet).

k8sAttributes:
  # Every entry is added to each metric series, span and log record, except the
  # Warning events the cluster receiver collects: those carry no attribute any
  # pod_association source can match, so that pipeline omits the processor.
  #
  # Dropping `k8s.pod.name` and `k8s.pod.uid` cuts metric cardinality noticeably,
  # because both change on every pod restart and so churn the series on each
  # rollout — at the cost of not being able to identify individual pods.
  # `k8s.replicaset.name` is left out for the same reason: it churns on every
  # rollout too, and (unlike pod name/uid) adds little beyond what
  # `k8s.deployment.name` + `k8s.pod.name` already give. It is not needed for
  # `service.name` below to resolve a bare-ReplicaSet ancestor either — that
  # tier of the processor's precedence chain resolves regardless.
  # `service.name` and `service.version` switch on the processor's own
  # implementation of the OTel k8s service.name/service.version precedence
  # (https://opentelemetry.io/docs/specs/semconv/non-normative/k8s-attributes/),
  # covering app.kubernetes.io/instance, app.kubernetes.io/name and
  # app.kubernetes.io/version pod labels and the owner-kind ancestor chain, on
  # top of the resource.opentelemetry.io/* annotations this chart maps below.
  # -- Kubernetes metadata to attach to telemetry. Dropping `k8s.pod.name` and
  # `k8s.pod.uid` is the largest cardinality saving available here, at the cost of
  # per-pod identification. An unsupported field name fails the collector at startup.
  # @default -- see values.yaml
  metadata:
    - k8s.namespace.name
    - k8s.deployment.name
    - k8s.statefulset.name
    - k8s.daemonset.name
    - k8s.cronjob.name
    - k8s.job.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.pod.uid
    - k8s.pod.start_time
    - service.name
    - service.version
    - k8s.container.name
    - container.id
    - container.image.name
    - container.image.tag

batch:
  # -- Item count that triggers a send.
  # @default -- 5000
  sendBatchSize: 5000
  # -- Hard cap on items per batch. Lower this if the backend rejects large
  # requests. Keeping it equal to sendBatchSize means a timeout can never build
  # an oversized batch.
  # @default -- 5000
  sendBatchMaxSize: 5000
  # -- Maximum time to wait before sending an undersized batch, e.g. `5s`.
  # Empty uses the processor's own default of 200ms.
  # @default -- ""
  timeout: ""

# Adds cloud and host attributes (cloud.provider, cloud.region,
# cloud.account.id, host.id) so telemetry can be traced back to a specific
# account, region and instance.
#
# Off by default: a detector that fails stops the collector from starting, and
# no feature gate suppresses that at this chart's collector floor.
resourceDetection:
  # -- Add cloud and host attributes such as cloud.provider, cloud.region,
  # cloud.account.id and host.id, via the resource_detection processor. Off by
  # default because a detector that fails stops the collector from starting, so
  # match the detectors below to where you actually run.
  # @default -- false
  enabled: false
  # Set the detectors that match where you actually run:
  #
  #   AWS/EKS      detectors: [env, eks, ec2]
  #   GCP/GKE      detectors: [env, gcp]
  #   Azure/AKS    detectors: [env, aks, azure]
  #   Anywhere     detectors: [env]              # the default
  #
  # ec2 MUST come after eks, so cloud.platform stays aws_eks: eks itself supplies
  # only cloud.provider and cloud.platform, and ec2 is what adds cloud.region,
  # cloud.account.id, cloud.availability_zone, host.id and host.name.
  #
  # Prefer leaving eks out unless you are on EKS. KUBERNETES_SERVICE_HOST is set
  # on every Kubernetes cluster, so the detector's own check falls through to a
  # Kubernetes API call rather than short-circuiting. That call failing is what
  # would stop the collector from starting — not merely finding nothing. Tested
  # on Docker Desktop with [env, eks, ec2]: every collector started and the
  # detector returned an empty resource without error. So this is a risk to avoid
  # taking, not a guaranteed breakage.
  #
  # ec2, gcp, azure and aks are safe to list anywhere: they return an empty
  # resource, without error, when their metadata service is unreachable.
  #
  # k8s_api (and k8snode, which it deprecated in v0.154.0) is unsupported. It
  # reads the node object from the Kubernetes API and fails startup if that call
  # fails, and the only attributes it adds that this chart does not already set are
  # k8s.node.uid and k8s.cluster.uid.
  # -- Detectors to run, in order. The first detector to supply an attribute wins;
  # attributes already on the telemetry are never replaced. Use [env, eks, ec2] on
  # EKS, [env, gcp] on GKE, [env, aks, azure] on AKS, [env] anywhere else, and keep
  # ec2 after eks so cloud.platform stays aws_eks. A detector that fails, or an empty
  # list, stops the collector from starting.
  # @default -- ["env"]
  detectors:
    - env
  # -- Deadline for the whole detection pass, and the HTTP client timeout the
  # detectors use. Not per detector.
  # @default -- "15s"
  timeout: 15s

# =============================================================================
# REDACTION CONFIGURATION
# =============================================================================
# Agent only. The other two collectors read the Kubernetes API and Prometheus
# endpoints rather than application telemetry; add the processor there through
# their own extraProcessors if those sources carry secrets.
redaction:
  # -- Mask credentials in the agent's logs, metrics and traces pipelines, via
  # the redaction processor. Off by default: the rules have to match your own key
  # and secret formats, and an over-broad one silently masks data you need.
  # @default -- false
  enabled: false
  # -- Redaction processor configuration, passed to the collector as-is. Covers
  # credentials, not PII. Applies to attributes at every level and to log bodies,
  # including nested maps and slices. Maps merge with these defaults but lists
  # replace them, so overriding `blocked_key_patterns` must repeat the entries you
  # want to keep. An empty config fails the render, because the processor's own
  # default deletes every attribute.
  # @default -- see values.yaml
  config:
    # false with no allowed_keys deletes every attribute. Leave it true.
    allow_all_keys: true
    # Match non-string values too. A masked value becomes a string.
    redact_all_types: true
    # Masking service.name or k8s.* breaks the Tsuga service and Kubernetes views.
    ignored_key_patterns:
      - '^service\..*'
      - '^otel\..*'
      - '^k8s\..*'
    # Matched against the key; the whole value is replaced.
    blocked_key_patterns:
      - '(?i).*(password|passwd|pwd).*'
      - '(?i).*(secret|credential).*'
      - '(?i).*api[._-]?key.*'
      - '(?i).*(access|refresh|auth)[._-]?token.*'
      - '(?i).*authorization.*'
      - '(?i).*session[._-]?id.*'
      - '(?i).*private[._-]?key.*'
    # Matched against the value, and only the match is replaced — which is why the
    # private key pattern spans the whole PEM block rather than its header.
    blocked_values:
      # Cloud and SaaS keys: AWS, GCP, GitHub, GitLab, Slack, Stripe.
      - 'AKIA[0-9A-Z]{16}'
      - 'ASIA[0-9A-Z]{16}'
      - 'AIza[0-9A-Za-z\-_]{35}'
      - 'gh[pousr]_[0-9a-zA-Z]{36,}'
      - 'glpat-[0-9a-zA-Z\-_]{20}'
      - 'xox[baprs]-[0-9a-zA-Z-]{10,72}'
      - 'sk_live_[0-9a-zA-Z]{24,}'
      # JWT, PEM private key, and credentials in a connection string or URL.
      - 'eyJ[0-9A-Za-z_-]+\.[0-9A-Za-z_-]+\.[0-9A-Za-z_-]+'
      - '(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----'
      - '://[^/\s:]*:[^/\s@]+@'

# =============================================================================
# SCHEDULING & RESOURCE DEFAULTS
# =============================================================================
# Defaults for all three collectors. Each collector's own resources,
# nodeSelector, tolerations or affinity value overrides the value here when it
# is set.
#
# These defaults suit a cluster of up to roughly 50 nodes. The collectors scale
# on different axes, so override them individually as the cluster grows:
#   agent        pods per node
#   cluster      objects in the cluster — raise this one first
#   statefulset  ingested throughput
resources:
  # -- Resource limits.
  limits:
    # -- CPU limit.
    # @default -- "500m"
    cpu: 500m
    # -- Memory limit. Also what memory_limiter is scaled from: it starts refusing
    # data at 80% of this. With no limit set it reads the node's total memory
    # instead, so the pod is OOMKilled before it ever sheds load.
    # @default -- "512Mi"
    memory: 512Mi
  # -- Resource requests.
  requests:
    # -- CPU request.
    # @default -- "100m"
    cpu: 100m
    # -- Memory request.
    # @default -- "128Mi"
    memory: 128Mi

# -- Node selector applied to every collector. Overridden per collector by
# agent.nodeSelector, cluster.nodeSelector or statefulset.nodeSelector.
# @default -- {}
nodeSelector: {}
# -- Tolerations applied to every collector. Overridden per collector by
# agent.tolerations, cluster.tolerations or statefulset.tolerations.
# @default -- []
tolerations: []
# -- Affinity rules applied to every collector. Overridden per collector by
# agent.affinity, cluster.affinity or statefulset.affinity.
# @default -- {}
affinity: {}

# =============================================================================
# OPENTELEMETRY OPERATOR DEPENDENCY
# =============================================================================
# Every collector this chart creates is an OpenTelemetryCollector custom
# resource, so the operator has to be present in the cluster one way or another.
opentelemetry-operator:
  # -- Install the OpenTelemetry Operator and its CRDs as subchart dependencies.
  # Leave this false when the operator is already installed in the cluster; the
  # custom resources this chart creates need it either way.
  enabled: false
  manager:
    collectorImage:
      # -- Collector image repository the operator falls back to for any
      # OpenTelemetryCollector that does not set an image of its own. This chart
      # always sets one, so it applies only when the top-level image is "".
      repository: otel/opentelemetry-collector-k8s
  admissionWebhooks:
    # -- Failure policy for the operator's admission webhooks. `Ignore` lets the
    # operator and the custom resources it manages be installed in the same pass.
    failurePolicy: "Ignore"

  # This is disabled by default, as doing so creates a race condition with helm.
  # https://github.com/open-telemetry/opentelemetry-helm-charts/issues/677
  # Users of this chart should _never_ set this to be true. If a user wishes
  # to install the CRDs through the opentelemetry-operator chart, it is recommended
  # to install the opentelemetry-operator chart separately and prior to the installation
  # of this chart.
  crds:
    # -- Let the operator subchart install the CRDs. Keep this false: it races
    # with helm, and this chart ships the CRDs through its own otel-crds
    # dependency instead.
    create: false

# =============================================================================
# SERVICE ACCOUNT & RBAC CONFIGURATION
# =============================================================================
# Service account shared by all three collectors and the Target Allocator.
serviceAccount:
  # -- Create the service account. Set this to false to run under an account you
  # create yourself, named by serviceAccount.name.
  # @default -- true
  create: true
  # -- Name of the service account, defaulting to the release fullname. The
  # collectors and Target Allocator run as this account and the ClusterRoleBinding
  # targets it, whether or not the chart creates it. With create=false, an account
  # of this name must exist before installing.
  # @default -- ""
  name: ""
  # -- Annotations to add to the service account
  # Useful for IRSA (IAM Roles for Service Accounts) or workload identity.
  # @default -- {}
  annotations: {}

# Cluster-scoped permissions the collectors need to read Kubernetes state.
rbac:
  # -- Create the ClusterRole and ClusterRoleBinding the collectors need to read
  # Kubernetes state. Without them kubelet_stats, k8s_cluster, k8s_objects and
  # k8s_attributes are all denied by the API server.
  # @default -- true
  create: true

# =============================================================================
# VALIDATION CONFIGURATION
# =============================================================================
# Render-time guardrails on the generated resource names.
validation:
  # -- Fail the render when a generated resource name would not meet Kubernetes
  # requirements.
  # @default -- true
  enabled: true
  # -- Maximum length for the release fullname. The fullname is already truncated to
  # 63 characters before this check runs, so at the default of 63 the check never
  # fires; lower it to enforce a tighter bound. Note the operator truncates the
  # Deployment and Service names it derives to 63 as well, which is where two
  # releases sharing a long prefix would collide.
  # @default -- 63
  maxNameLength: 63
  # -- Require generated names to be lowercase alphanumeric with hyphens. Only
  # applies while validation.enabled is true.
  # @default -- true
  enforceNamingConventions: true
