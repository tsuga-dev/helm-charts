{{- if .Values.targetAllocator.enabled }}
{{- include "opentelemetry-kube-stack.validateResourceNames" . }}
apiVersion: opentelemetry.io/v1alpha1
kind: TargetAllocator
metadata:
  name: {{ include "opentelemetry-kube-stack.fullname" . }}-ta
  labels:
    {{- include "opentelemetry-kube-stack.componentLabels" (dict "component" "target-allocator" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
spec:
  {{- /* A serviceAccount in the passthrough spec is the user's explicit choice and
         wins; emitting the chart's as well would put two of the same key in one map. */}}
  {{- if not (.Values.targetAllocator.spec).serviceAccount }}
  {{- with include "opentelemetry-kube-stack.collectorServiceAccountName" . }}
  serviceAccount: {{ . }}
  {{- end }}
  {{- end }}
  {{- with .Values.targetAllocator.spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
