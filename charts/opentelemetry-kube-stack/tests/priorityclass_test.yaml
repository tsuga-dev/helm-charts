---
suite: agent priorityclass tests
templates:
  - priorityclass.yaml
tests:
  - it: should not render by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when the agent is disabled
    set:
      clusterName: "test-cluster"
      agent.enabled: false
      agent.priorityClass.create: true
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the PriorityClass when enabled
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.priorityClass.create: true
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: PriorityClass
      - equal:
          path: metadata.name
          value: "test-release-opentelemetry-kube-stack-agent"
      # Far below system-cluster-critical (2000000000), far above the 0 an
      # unclassed pod gets.
      - equal:
          path: value
          value: 1000000
      - equal:
          path: globalDefault
          value: false
      # Protects the agent from eviction without displacing the workloads it
      # exists to observe.
      - equal:
          path: preemptionPolicy
          value: Never

  - it: should honour a custom value and name
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.priorityClass.create: true
      agent.priorityClass.name: "custom-agent-priority"
      agent.priorityClass.value: 500000
    release:
      name: "test-release"
    asserts:
      - equal:
          path: metadata.name
          value: "custom-agent-priority"
      - equal:
          path: value
          value: 500000
