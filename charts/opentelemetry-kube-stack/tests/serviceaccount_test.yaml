---
suite: serviceaccount tests
templates:
  - serviceaccount.yaml
tests:
  - it: should create service account with default values
    set:
      clusterName: "test-cluster"
      serviceAccount.create: true
      serviceAccount.name: ""
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: "test-release-opentelemetry-kube-stack"

  - it: should keep Helm release metadata when a user annotation collides with it
    set:
      clusterName: "test-cluster"
      serviceAccount.create: true
      serviceAccount.annotations:
        meta.helm.sh/release-name: "hijacked"
        meta.helm.sh/release-namespace: "hijacked-ns"
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/otel-role"
    release:
      name: "test-release"
      namespace: "test-namespace"
    asserts:
      - equal:
          path: metadata.annotations["meta.helm.sh/release-name"]
          value: "test-release"
      - equal:
          path: metadata.annotations["meta.helm.sh/release-namespace"]
          value: "test-namespace"
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/otel-role"
