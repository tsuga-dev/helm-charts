---
suite: rbac tests
templates:
  - rbac.yaml
tests:
  - it: should create cluster role and role binding
    set:
      clusterName: "test-cluster"
      rbac.create: true
      serviceAccount.create: true
      serviceAccount.name: ""
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 2

  - it: should not include monitoring.coreos.com rules by default
    set:
      clusterName: "test-cluster"
      rbac.create: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
        documentIndex: 0

  - it: should include monitoring.coreos.com rules when prometheusCR enabled
    set:
      clusterName: "test-cluster"
      rbac.create: true
      targetAllocator.enabled: true
      targetAllocator.spec.prometheusCR.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
            resources: ["servicemonitors", "podmonitors"]
            verbs: ["get", "list", "watch"]
        documentIndex: 0

  - it: should not include endpointslices permission by default
    set:
      clusterName: "test-cluster"
      rbac.create: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]

  # The binding subject a bring-your-own-account install produces. Paired with the
  # collector-side assertion in target-allocator_test.yaml: the two must name the
  # same account, or the install comes up healthy and then 403s every Kubernetes
  # read.
  - it: should bind the user-supplied service account when create is false
    set:
      clusterName: "test-cluster"
      rbac.create: true
      serviceAccount.create: false
      serviceAccount.name: "my-sa"
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    documentIndex: 1
    asserts:
      - equal:
          path: subjects[0].name
          value: "my-sa"

  - it: should include endpointslices permission when targetAllocator enabled
    set:
      clusterName: "test-cluster"
      rbac.create: true
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
