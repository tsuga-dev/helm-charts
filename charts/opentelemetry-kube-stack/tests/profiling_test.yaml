---
suite: profiling collector tests
templates:
  - profiling.yaml
tests:
  - it: should not render anything by default
    set:
      clusterName: "test-cluster"
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a privileged hostPID daemonset with the profiles feature gate
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: metadata.name
          value: "test-release-opentelemetry-kube-stack-profiling"
      - equal:
          path: spec.mode
          value: daemonset
      - equal:
          path: spec.hostPID
          value: true
      - equal:
          path: spec.securityContext.privileged
          value: true
      - equal:
          path: spec.securityContext.runAsUser
          value: 0
      # Without the gate the collector rejects the profiles pipeline outright.
      - equal:
          path: spec.args.feature-gates
          value: "+service.profilesSupport"
      # Its own distro, not the shared contrib image, which has no profiling receiver.
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-ebpf-profiler:0.161.0
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should build a profiles pipeline without the batch processor
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # batch registers traces/metrics/logs only; a profiles pipeline naming it
      # fails at startup.
      - equal:
          path: spec.config.service.pipelines.profiles.processors
          value:
            - memory_limiter
            - k8s_attributes
            - transform/host_processes
            - resource
      - equal:
          path: spec.config.service.pipelines.profiles.receivers
          value:
            - profiling
      - equal:
          path: spec.config.service.pipelines.profiles.exporters
          value:
            - otlp_http/tsuga
      - isNull:
          path: spec.config.processors.batch

  - it: should sample at 20Hz, the rate Tsuga assumes when deriving CPU time
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.profiling.samples_per_second
          value: 20

  - it: should promote a custom service name env var and drop the raw attribute
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      profiling.serviceNameEnvVar: APP_NAME
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.profiling.include_env_vars
          value: APP_NAME
      # Before k8s_attributes, so the process's own value wins over the
      # Kubernetes-derived fallback.
      - equal:
          path: spec.config.service.pipelines.profiles.processors[1]
          value: transform/service_name
      # Paths carry their `resource.` context prefix: without it the collector rewrites
      # them at startup and logs that they should be rewritten.
      - matchRegex:
          path: spec.config.processors.transform/service_name.profile_statements[0].statements[0]
          pattern: '^set\(resource\.attributes\["service\.name"\], resource\.attributes\['
      - matchRegex:
          path: spec.config.processors.transform/service_name.profile_statements[0].statements[1]
          pattern: 'delete_key\(resource\.attributes, "process\.environment_variable\.APP_NAME"\)'

  - it: should leave OTEL_SERVICE_NAME to the receiver by default
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # The receiver reads OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES itself
      # without reporting them, so surfacing one would only add a dimension.
      - isNull:
          path: spec.config.receivers.profiling.include_env_vars
      - isNull:
          path: spec.config.processors.transform/service_name

  - it: should name host processes after k8s_attributes has had its turn
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # After k8s_attributes, or the fallback would outrank the Kubernetes name.
      - equal:
          path: spec.config.service.pipelines.profiles.processors[2]
          value: transform/host_processes
      # One service for every shim, rather than one per pod.
      - equal:
          path: spec.config.processors.transform/host_processes.profile_statements[0].statements[0]
          value: set(resource.attributes["service.name"], "containerd-shim") where IsMatch(resource.attributes["service.name"], "^containerd-shim-[0-9a-f]{64}$")
      - equal:
          path: spec.config.processors.transform/host_processes.profile_statements[0].statements[1]
          value: set(resource.attributes["service.name"], Concat(["unknown_service", resource.attributes["process.executable.name"]], ":")) where resource.attributes["service.name"] == nil and resource.attributes["process.executable.name"] != nil

  - it: should refuse a profiler image below the collector floor
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      profiling.image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-ebpf-profiler:0.157.0
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # The default metadata extracts container.image.tags.
      - failedTemplate:
          errorPattern: "older than v0.161.0"

  - it: should associate pods on container.id
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # container.id is the only key the profiling receiver gives k8s_attributes
      # to match on.
      - equal:
          path: spec.config.processors.k8s_attributes.pod_association[0].sources[0].name
          value: container.id
      - equal:
          path: spec.config.processors.k8s_attributes.filter.node_from_env_var
          value: K8S_NODE_NAME
      # Nothing trims the resource afterwards: container.id, process.pid and the
      # process executable attributes the receiver sets are what tell one
      # process apart from another inside a service, so they are exported.
      - isNull:
          path: spec.config.processors.resource/trim
      - notContains:
          path: spec.config.service.pipelines.profiles.processors
          content: resource/trim

  - it: should keep the k8s metadata list narrow for cardinality
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # service.name/service.version are what activate the processor's OTel
      # Kubernetes service precedence; the pod-scoped attributes are absent on
      # purpose.
      - equal:
          path: spec.config.processors.k8s_attributes.extract.metadata
          value:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.container.name
            - container.image.name
            - container.image.tags
            - service.name
            - service.version

  - it: should honour resourceDetection.enabled like the other collectors
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      resourceDetection.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.resource_detection.override
          value: false
      # First among the enrichment processors. With override: false it never
      # replaces a service.name the profiled process reported for itself.
      - equal:
          path: spec.config.service.pipelines.profiles.processors
          value:
            - memory_limiter
            - resource_detection
            - k8s_attributes
            - transform/host_processes
            - resource

  - it: should omit resource_detection while resourceDetection is disabled
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors.resource_detection
      - notContains:
          path: spec.config.service.pipelines.profiles.processors
          content: resource_detection

  - it: should pin proto encoding regardless of the chart-wide encoding
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.encoding: json
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.exporters.otlp_http/tsuga.encoding
          value: proto

  - it: should drop the tsuga exporter when disabled for profiling
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      tsuga.enabledForProfiling: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.service.pipelines.profiles.exporters
          value: []

  - it: should accept extra processors and a full custom config
    set:
      clusterName: "test-cluster"
      profiling.enabled: true
      profiling.config.extraProcessors:
        filter/drop: {}
      profiling.config.service.pipelines.profiles.extraProcessors:
        - filter/drop
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.service.pipelines.profiles.processors[4]
          value: filter/drop

  - it: should fail without a cluster name
    set:
      profiling.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."
