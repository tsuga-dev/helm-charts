---
suite: statefulset tests
templates:
  - statefulset.yaml
tests:
  - it: should not render when targetAllocator disabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should create statefulset collector when targetAllocator enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.mode
          value: statefulset
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"
      - equal:
          path: metadata.labels["opentelemetry.io/target-allocator"]
          value: "test-release-opentelemetry-kube-stack-ta"

  - it: should not set serviceAccount when serviceAccount.create is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - notExists:
          path: spec.serviceAccount

  - it: should use custom replicas when specified
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      statefulset.replicas: 3
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should not include tsuga exporter when enabledForStatefulset is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForStatefulset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: []

  - it: should convert cumulative metrics to delta before export
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNotNull:
          path: spec.config.processors.cumulativetodelta
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulativetodelta, k8s_attributes, resource, batch]

  - it: should fail to render when clusterName is not set
    set:
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should leave the collector image to the operator by default
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.image

  - it: should honour the top-level image for the statefulset collector
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      image: "example.test/collector:0.152.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/collector:0.152.0"

  - it: should check memory every second and set GOMEMLIMIT
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.memory_limiter.check_interval
          value: 1s
      - contains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "429496729"

  - it: should detect resources when enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      resourceDetection.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.resourcedetection.detectors
          value: [env]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulativetodelta, resourcedetection, k8s_attributes, resource, batch]
