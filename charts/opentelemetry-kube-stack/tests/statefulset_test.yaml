---
suite: statefulset tests
templates:
  - statefulset.yaml
tests:
  - it: should not render when targetAllocator disabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should create statefulset collector when targetAllocator enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.mode
          value: statefulset
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"
      - equal:
          path: metadata.labels["opentelemetry.io/target-allocator"]
          value: "test-release-opentelemetry-kube-stack-ta"

  - it: should not set serviceAccount when serviceAccount.create is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - notExists:
          path: spec.serviceAccount

  - it: should use custom replicas when specified
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      statefulset.replicas: 3
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should not include tsuga exporter when enabledForStatefulset is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForStatefulset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value: []

  - it: should convert cumulative metrics to delta before export
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNotNull:
          path: spec.config.processors.cumulative_to_delta
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulative_to_delta, k8s_attributes, resource, batch]

  - it: should fail to render when clusterName is not set
    set:
      targetAllocator.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should detect resources when enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      resourceDetection.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.resource_detection.detectors
          value: [env]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulative_to_delta, resource_detection, k8s_attributes, resource, batch]

  - it: should give the statefulset collector a health_check extension
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.extensions.health_check.endpoint
          value: ${env:MY_POD_IP}:13133
      - equal:
          path: spec.config.service.extensions
          value: [health_check]

  - it: should apply the scrape interval to both the scrape config and the allocator
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      statefulset.scrapeInterval: 60s
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.prometheus.config.scrape_configs[0].scrape_interval
          value: 60s
      - equal:
          path: spec.config.receivers.prometheus.target_allocator.interval
          value: 60s

  - it: should use the shared pinned collector image by default
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
    release:
      name: "test-release"
    asserts:
      # contrib, shared with the other two collectors. It is a strict superset of
      # the k8s distribution, and the agent already pulls it onto every node.
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0

  - it: should let the statefulset image override the shared one
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      statefulset.image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.157.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.157.0

  - it: should associate pods only on sources the processor recognizes
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
    release:
      name: "test-release"
    asserts:
      # net.host.name used to lead this list. Nothing in this pipeline sets that
      # attribute, so the rule was skipped on every record.
      - equal:
          path: spec.config.processors.k8s_attributes.pod_association
          value:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: connection
