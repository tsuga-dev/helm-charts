---
suite: target-allocator tests
templates:
  - target-allocator.yaml
tests:
  - it: should not render when targetAllocator disabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - hasDocuments:
          count: 0

  - it: should create TargetAllocator CR when enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      targetAllocator.spec.allocationStrategy: "consistent-hashing"
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: TargetAllocator
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"
      - equal:
          path: spec.allocationStrategy
          value: "consistent-hashing"

  - it: should not set serviceAccount when serviceAccount.create is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: TargetAllocator
      - notExists:
          path: spec.serviceAccount

  # create:false with an explicit name is the bring-your-own-account idiom, and
  # rbac.yaml already binds that name -- so the workloads have to be told to use
  # it. Covers the shared collectorServiceAccountName helper that daemonset.yaml,
  # cluster-receiver.yaml and statefulset.yaml render through the same way.
  - it: should use a named service account when create is false
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      serviceAccount.create: false
      serviceAccount.name: "my-sa"
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.serviceAccount
          value: "my-sa"

  # The passthrough spec and the chart's own field write to the same map, so the
  # chart has to stand down rather than emit a second serviceAccount key. helm and
  # kubectl both let the duplicate through last-one-wins, but kyaml consumers
  # (Flux, Kustomize) hard-fail on it, so only a test catches this.
  - it: should let a spec serviceAccount win without duplicating the key
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      targetAllocator.spec.serviceAccount: "mine"
      serviceAccount.create: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # Strict YAML parsing rejects the duplicate outright, so loading this
      # document at all is half the assertion.
      - equal:
          path: spec.serviceAccount
          value: "mine"

  - it: should set prometheusCR fields when enabled
    set:
      clusterName: "test-cluster"
      targetAllocator.enabled: true
      targetAllocator.spec.prometheusCR.enabled: true
      targetAllocator.spec.prometheusCR.serviceMonitorSelector.matchLabels.release: "test"
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.prometheusCR.enabled
          value: true
      - equal:
          path: spec.prometheusCR.serviceMonitorSelector.matchLabels.release
          value: "test"
