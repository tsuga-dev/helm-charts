---
suite: daemonset tests
templates:
  - daemonset.yaml
tests:
  - it: should create daemonset with default values
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.hostNetwork: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.hostNetwork
          value: true
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should not include tsuga exporter when enabledForDaemonset is false
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForDaemonset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should configure spanmetrics with low-cardinality HTTP dimensions by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].name
          value: "http.request.method"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].default
          value: "GET"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[1].name
          value: "http.response.status_code"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[2].name
          value: "http.route"
      - notExists:
          path: spec.config.connectors.span_metrics.calls_dimensions

  - it: should not reference the Tsuga secret when the exporter is disabled everywhere
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.enabledForClusterReceiver: false
      tsuga.enabledForDaemonset: false
      tsuga.enabledForStatefulset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      # No secret-backed env is injected, so no secret is required to start.
      - notContains:
          path: spec.env
          content:
            name: TSUGA_API_KEY
            valueFrom:
              secretKeyRef:
                name: otel-secret
                key: TSUGA_API_KEY
      # Non-secret env is still present.
      - contains:
          path: spec.env
          content:
            name: MY_POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
      # Internal-telemetry OTLP export (which needs the secret) is skipped.
      - notExists:
          path: spec.config.service.telemetry.metrics

  - it: should exclude pseudo filesystems from the filesystem scraper
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # node_exporter's defFSTypesExcluded set, verbatim.
      - equal:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_fs_types
          value:
            match_type: strict
            fs_types:
              - autofs
              - binfmt_misc
              - bpf
              - cgroup
              - cgroup2
              - configfs
              - debugfs
              - devpts
              - devtmpfs
              - erofs
              - fusectl
              - hugetlbfs
              - iso9660
              - mqueue
              - nsfs
              - overlay
              - proc
              - procfs
              - pstore
              - rpc_pipefs
              - securityfs
              - selinuxfs
              - squashfs
              - sysfs
              - tracefs
      # tmpfs is kept on purpose: /run and friends are real usage.
      - notContains:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_fs_types.fs_types
          content: tmpfs
      - equal:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_mount_points
          value:
            match_type: regexp
            mount_points:
              - '^/dev($|/)'
              - '^/proc($|/)'
              - '^/run/credentials($|/)'
              - '^/run/k3s/containerd($|/)'
              - '^/snap($|/)'
              - '^/sys($|/)'
              - '^/var/lib/containers/storage($|/)'
              - '^/var/lib/docker($|/)'
              - '^/var/lib/kubelet($|/)'

  - it: should fail to render when clusterName is not set
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should run memory_limiter first and batch last in every pipeline
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulative_to_delta, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.traces.processors
          value: [memory_limiter, k8s_attributes, resource, resource/node, batch]

  - it: should stamp k8s.node.name with insert on every pipeline
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # insert, so a node name already on the record is never overwritten.
      - equal:
          path: spec.config.processors["resource/node"].attributes
          value:
            - key: k8s.node.name
              value: ${env:K8S_NODE_NAME}
              action: insert
      - contains:
          path: spec.config.service.pipelines.logs.processors
          content: resource/node
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: resource/node
      - contains:
          path: spec.config.service.pipelines.traces.processors
          content: resource/node

  - it: should not detect resources by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # A failing detector stops the collector from starting, and no feature gate
      # suppresses that: the one that controlled it went stable in v0.146.0 and
      # was removed in v0.150.0, both below this chart's floor.
      - isNull:
          path: spec.config.processors.resource_detection
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulative_to_delta, k8s_attributes, resource, resource/node, batch]

  - it: should detect resources when enabled
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      resourceDetection.enabled: true
      resourceDetection.detectors: [env, eks, ec2]
      resourceDetection.timeout: 20s
    release:
      name: "test-release"
    asserts:
      # resource_detection, the canonical type from v0.153.0. The old
      # resourcedetection spelling is a deprecated alias that warns on startup.
      - equal:
          path: spec.config.processors.resource_detection.detectors
          value: [env, eks, ec2]
      - equal:
          path: spec.config.processors.resource_detection.timeout
          value: 20s
      # Against the processor's own default of true, so a detected value never
      # replaces one an instrumented application already set.
      - equal:
          path: spec.config.processors.resource_detection.override
          value: false
      # After cumulative_to_delta, which this chart deliberately runs before
      # enrichment so delta state is not keyed on a resource that later grows.
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulative_to_delta, resource_detection, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.traces.processors
          value: [memory_limiter, resource_detection, k8s_attributes, resource, resource/node, batch]

  - it: should fall back to a usable detection timeout
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      resourceDetection.enabled: true
      resourceDetection.timeout: null
    release:
      name: "test-release"
    asserts:
      # An empty timeout would render as 0s, expiring the per-detector context
      # before the first call and failing Start().
      - equal:
          path: spec.config.processors.resource_detection.timeout
          value: 15s
  - it: should collect container and volume metrics from the kubelet
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.kubelet_stats.metric_groups
          value: [node, pod, container, volume]
      - equal:
          path: spec.config.receivers.kubelet_stats.extra_metadata_labels
          value: [k8s.volume.type]
      - equal:
          path: spec.config.receivers.kubelet_stats.metrics["k8s.container.cpu_limit_utilization"].enabled
          value: true
      - equal:
          path: spec.config.receivers.kubelet_stats.metrics["k8s.pod.memory_request_utilization"].enabled
          value: true
      # container.cpu.usage, k8s.pod.cpu.usage and k8s.node.cpu.usage are
      # already enabled by default, so configuring them would be inert.
      - isNull:
          path: spec.config.receivers.kubelet_stats.metrics["container.cpu.usage"]

  - it: should collect only the kubelet metric groups asked for
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.kubeletStats.metricGroups: [node, pod]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.kubelet_stats.metric_groups
          value: [node, pod]

  - it: should fall back to a usable set of kubelet metric groups
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.kubeletStats.metricGroups: null
    release:
      name: "test-release"
    asserts:
      # An empty metric_groups would collect nothing from the kubelet.
      - equal:
          path: spec.config.receivers.kubelet_stats.metric_groups
          value: [node, pod, container, volume]

  - it: should avoid the kubelet /pods endpoint when told to
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.kubeletStats.usePodsEndpoint: false
    release:
      name: "test-release"
    asserts:
      # Both of these trigger the /pods call, which GKE Autopilot cannot
      # authorize, and whose failure discards the whole scrape.
      - isNull:
          path: spec.config.receivers.kubelet_stats.extra_metadata_labels
      - isNull:
          path: spec.config.receivers.kubelet_stats.metrics
      # The metrics that only need /stats/summary are still collected.
      - equal:
          path: spec.config.receivers.kubelet_stats.metric_groups
          value: [node, pod, container, volume]

  - it: should let the kubelet TLS settings be tightened
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.kubeletStats.insecureSkipVerify: false
      agent.kubeletStats.caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.kubelet_stats.insecure_skip_verify
          value: false
      - equal:
          path: spec.config.receivers.kubelet_stats.ca_file
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  - it: should omit ca_file when it is not set
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # An empty ca_file would fail the receiver's own config validation.
      - isNull:
          path: spec.config.receivers.kubelet_stats.ca_file
      - equal:
          path: spec.config.receivers.kubelet_stats.insecure_skip_verify
          value: true

  - it: should apply the collection intervals
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.kubeletStats.collectionInterval: 60s
      agent.hostMetrics.collectionInterval: 90s
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.kubelet_stats.collection_interval
          value: 60s
      - equal:
          path: spec.config.receivers.host_metrics.collection_interval
          value: 90s

  - it: should honour a user log exclude even when collecting its own logs
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.collectOtelLogs: true
      agent.fileLog.exclude: ["/var/log/pods/kube-system_*/*/*.log"]
    release:
      name: "test-release"
    asserts:
      # Regression guard: the exclude key used to live inside the
      # `not collectOtelLogs` branch, so a user exclude vanished whenever
      # collectOtelLogs was true.
      - equal:
          path: spec.config.receivers.file_log.exclude
          value: ["/var/log/pods/kube-system_*/*/*.log"]

  - it: should merge user excludes with the self-ingestion excludes
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.fileLog.exclude: ["/var/log/pods/kube-system_*/*/*.log"]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.file_log.exclude
          value:
            - /var/log/pods/kube-system_*/*/*.log
            - /var/log/pods/*/otc-container/*.log
            - /var/log/pods/*/otel-collector/*.log

  - it: should narrow the log include paths
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.fileLog.include: ["/var/log/pods/prod_*/*/*.log"]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.file_log.include
          value: ["/var/log/pods/prod_*/*/*.log"]

  - it: should remove span metrics entirely when disabled
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.spanMetrics.enabled: false
    release:
      name: "test-release"
    asserts:
      # The connector and both pipeline references must all go, or the collector
      # rejects the config with an unknown component reference.
      - isNull:
          path: spec.config.connectors
      - equal:
          path: spec.config.service.pipelines.metrics.receivers
          value: [otlp, kubelet_stats, host_metrics]
      - equal:
          path: spec.config.service.pipelines.traces.exporters
          value: [otlp_http/tsuga]

  - it: should let span metric dimensions be replaced
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.spanMetrics.dimensions:
        - name: rpc.method
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.connectors.span_metrics.dimensions
          value:
            - name: rpc.method

  - it: should let the OTLP listen addresses be changed
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.otlp.grpcEndpoint: 0.0.0.0:14317
      agent.otlp.httpEndpoint: ""
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.otlp.protocols.grpc.endpoint
          value: 0.0.0.0:14317
      # An empty endpoint drops the protocol rather than binding port 0.
      - isNull:
          path: spec.config.receivers.otlp.protocols.http

  - it: should apply the shared batch and metadata settings
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      batch.sendBatchSize: 1000
      batch.sendBatchMaxSize: 2000
      batch.timeout: 5s
      k8sAttributes.metadata: [k8s.namespace.name, k8s.node.name]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.batch.send_batch_size
          value: 1000
      - equal:
          path: spec.config.processors.batch.send_batch_max_size
          value: 2000
      - equal:
          path: spec.config.processors.batch.timeout
          value: 5s
      - equal:
          path: spec.config.processors.k8s_attributes.extract.metadata
          value: [k8s.namespace.name, k8s.node.name]

  - it: should omit the batch timeout by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # Left unset so the processor's own 200ms default applies.
      - isNull:
          path: spec.config.processors.batch.timeout

  - it: should drop the health_check extension when the endpoint is empty
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.healthCheckEndpoint: ""
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.extensions
      # buildService always emits the key, so it renders as an empty list
      # rather than being omitted.
      - equal:
          path: spec.config.service.extensions
          value: []

  - it: should pin a concrete collector image tag by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # Untagged would resolve to :latest, which forces imagePullPolicy: Always
      # and leaves the version floor unenforceable.
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0

  - it: should let the agent image override the pinned default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.com/collector:0.157.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:0.157.0

  - it: should reject a pinned collector image below the v0.157.0 floor
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "collector image \"ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0\" is older than v0.157.0. This chart's default config uses the cumulative_to_delta and resource_detection processor types, which collectors below v0.157.0 and v0.153.0 respectively reject at startup with `unknown type`. Either pin a v0.157.0+ image, or stay on chart 0.10.x."

  - it: should accept a v-prefixed image tag at the floor
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.com/collector:v0.157.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: example.com/collector:v0.157.0

  - it: should keep the inline-map telemetry resource the operator can parse
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # Deliberately the legacy form. The collector prefers a resource.attributes
      # array, but the operator types resource as map[string]*string, so the array
      # form fails to unmarshal and the whole telemetry block gets replaced with
      # an empty map — losing both attributes instead of just the format.
      - equal:
          path: spec.config.service.telemetry.resource
          value:
            k8s.cluster.name: test-cluster
            service.instance.id: ${POD_UID}

  - it: should apply the version floor to every collector image
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      cluster.image: "example.com/collector:0.150.0"
    release:
      name: "test-release"
    asserts:
      # The check covers all three collector images, not just the one whose
      # template is being rendered.
      - failedTemplate:
          errorMessage: "collector image \"example.com/collector:0.150.0\" is older than v0.157.0. This chart's default config uses the cumulative_to_delta and resource_detection processor types, which collectors below v0.157.0 and v0.153.0 respectively reject at startup with `unknown type`. Either pin a v0.157.0+ image, or stay on chart 0.10.x."

  - it: should hand the image choice to the operator when set empty
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: ""
    release:
      name: "test-release"
    asserts:
      # An empty image means the operator picks, which also means the floor
      # check has nothing to verify.
      - equal:
          path: spec.image
          value: ""

  - it: should reject a suffixed image tag below the floor
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.com/collector:0.156.0-amd64"
    release:
      name: "test-release"
    asserts:
      # A suffixed tag is a semver prerelease, which a constraint without one
      # excludes — so comparing the bare tag used to let these straight through.
      - failedTemplate:
          errorMessage: "collector image \"example.com/collector:0.156.0-amd64\" is older than v0.157.0. This chart's default config uses the cumulative_to_delta and resource_detection processor types, which collectors below v0.157.0 and v0.153.0 respectively reject at startup with `unknown type`. Either pin a v0.157.0+ image, or stay on chart 0.10.x."

  - it: should skip the floor check for an image it cannot version
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.com/collector:latest"
    release:
      name: "test-release"
    asserts:
      # Nothing to compare, so the render must proceed rather than fail closed.
      - equal:
          path: spec.image
          value: example.com/collector:latest
