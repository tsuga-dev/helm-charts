---
suite: daemonset tests
templates:
  - daemonset.yaml
tests:
  - it: should create daemonset with default values
    set:
      agent.enabled: true
      agent.hostNetwork: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.hostNetwork
          value: true
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should not include tsuga exporter when enabledForDaemonset is false
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForDaemonset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should configure spanmetrics with low-cardinality HTTP dimensions by default
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].name
          value: "http.request.method"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].default
          value: "GET"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[1].name
          value: "http.response.status_code"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[2].name
          value: "http.route"
      - notExists:
          path: spec.config.connectors.span_metrics.calls_dimensions

  - it: should not reference the Tsuga secret when the exporter is disabled everywhere
    set:
      agent.enabled: true
      tsuga.enabledForClusterReceiver: false
      tsuga.enabledForDaemonset: false
      tsuga.enabledForStatefulset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      # No secret-backed env is injected, so no secret is required to start.
      - notContains:
          path: spec.env
          content:
            name: TSUGA_API_KEY
            valueFrom:
              secretKeyRef:
                name: otel-secret
                key: TSUGA_API_KEY
      # Non-secret env is still present.
      - contains:
          path: spec.env
          content:
            name: MY_POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
      # Internal-telemetry OTLP export (which needs the secret) is skipped.
      - notExists:
          path: spec.config.service.telemetry.metrics

  - it: should run memory_limiter first and batch last in every pipeline
    set:
      agent.enabled: true
      clusterName: "test-cluster"
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, k8s_attributes, resource, cumulativetodelta, batch]
      - equal:
          path: spec.config.service.pipelines.traces.processors
          value: [memory_limiter, k8s_attributes, resource, batch]

  - it: should stamp node identity even without a cluster name
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # insert, so k8s_attributes' pod-derived node name is never clobbered.
      - contains:
          path: spec.config.processors.resource.attributes
          content:
            key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert
      # The dead processor is gone: it stamped the collector's own pod UID as
      # service.instance.id, and was referenced by no pipeline.
      - isNull:
          path: spec.config.processors["resource/collector"]

  - it: should exclude pseudo filesystems from the filesystem scraper
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - contains:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_fs_types.fs_types
          content: overlay
      - contains:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_mount_points.mount_points
          content: ^/var/lib/kubelet($|/)

  - it: should derive service identity and container image from kubernetes
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - contains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: service.name
      - contains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: container.image.tag
      # High-cardinality attributes are deliberately excluded: each takes a new
      # value on every pod or container restart, or restates k8s.pod.name.
      - notContains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: k8s.pod.ip
      - notContains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: k8s.pod.hostname
      - notContains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: container.id
      - notContains:
          path: spec.config.processors.k8s_attributes.extract.metadata
          content: service.instance.id
      # Ownership falls back to the namespace when a pod does not declare it.
      - contains:
          path: spec.config.processors.k8s_attributes.extract.labels
          content:
            tag_name: team
            key: resource.opentelemetry.io/team
            from: namespace
      # Node topology without any cloud metadata calls.
      - contains:
          path: spec.config.processors.k8s_attributes.extract.labels
          content:
            tag_name: cloud.region
            key: topology.kubernetes.io/region
            from: node

  - it: should keep extra label mappings when merged into the shared extract block
    set:
      agent.enabled: true
      agent.extraLabelMapping:
        - tag_name: app.version
          key: app.version
          from: pod
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - contains:
          path: spec.config.processors.k8s_attributes.extract.labels
          content:
            tag_name: app.version
            key: app.version
            from: pod
