---
suite: daemonset tests
templates:
  - daemonset.yaml
tests:
  - it: should create daemonset with default values
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.hostNetwork: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.hostNetwork
          value: true
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should not include tsuga exporter when enabledForDaemonset is false
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForDaemonset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should configure spanmetrics with low-cardinality HTTP dimensions by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].name
          value: "http.request.method"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[0].default
          value: "GET"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[1].name
          value: "http.response.status_code"
      - equal:
          path: spec.config.connectors.span_metrics.dimensions[2].name
          value: "http.route"
      - notExists:
          path: spec.config.connectors.span_metrics.calls_dimensions

  - it: should not reference the Tsuga secret when the exporter is disabled everywhere
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.enabledForClusterReceiver: false
      tsuga.enabledForDaemonset: false
      tsuga.enabledForStatefulset: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      # No secret-backed env is injected, so no secret is required to start.
      - notContains:
          path: spec.env
          content:
            name: TSUGA_API_KEY
            valueFrom:
              secretKeyRef:
                name: otel-secret
                key: TSUGA_API_KEY
      # Non-secret env is still present.
      - contains:
          path: spec.env
          content:
            name: MY_POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
      # Internal-telemetry OTLP export (which needs the secret) is skipped.
      - notExists:
          path: spec.config.service.telemetry.metrics

  - it: should exclude pseudo filesystems from the filesystem scraper
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      # node_exporter's defFSTypesExcluded set, verbatim.
      - equal:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_fs_types
          value:
            match_type: strict
            fs_types:
              - autofs
              - binfmt_misc
              - bpf
              - cgroup
              - cgroup2
              - configfs
              - debugfs
              - devpts
              - devtmpfs
              - erofs
              - fusectl
              - hugetlbfs
              - iso9660
              - mqueue
              - nsfs
              - overlay
              - proc
              - procfs
              - pstore
              - rpc_pipefs
              - securityfs
              - selinuxfs
              - squashfs
              - sysfs
              - tracefs
      # tmpfs is kept on purpose: /run and friends are real usage.
      - notContains:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_fs_types.fs_types
          content: tmpfs
      - equal:
          path: spec.config.receivers.host_metrics.scrapers.filesystem.exclude_mount_points
          value:
            match_type: regexp
            mount_points:
              - '^/dev($|/)'
              - '^/proc($|/)'
              - '^/run/credentials($|/)'
              - '^/run/k3s/containerd($|/)'
              - '^/snap($|/)'
              - '^/sys($|/)'
              - '^/var/lib/containers/storage($|/)'
              - '^/var/lib/docker($|/)'
              - '^/var/lib/kubelet($|/)'

  - it: should fail to render when clusterName is not set
    set:
      agent.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should run memory_limiter first and batch last in every pipeline
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, cumulativetodelta, k8s_attributes, resource, resource/node, batch]
      - equal:
          path: spec.config.service.pipelines.traces.processors
          value: [memory_limiter, k8s_attributes, resource, resource/node, batch]

  - it: should stamp k8s.node.name with insert on every pipeline
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # insert, so a node name already on the record is never overwritten.
      - equal:
          path: spec.config.processors["resource/node"].attributes
          value:
            - key: k8s.node.name
              value: ${env:K8S_NODE_NAME}
              action: insert
      - contains:
          path: spec.config.service.pipelines.logs.processors
          content: resource/node
      - contains:
          path: spec.config.service.pipelines.metrics.processors
          content: resource/node
      - contains:
          path: spec.config.service.pipelines.traces.processors
          content: resource/node

  - it: should leave the collector image to the operator by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # No image field at all, so the operator applies the version its own
      # subchart pins. A bare repository name would resolve to :latest and force
      # imagePullPolicy: Always.
      - isNull:
          path: spec.image

  - it: should honour the top-level image, and let agent.image win over it
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      image: "example.test/collector:0.152.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/collector:0.152.0"

  - it: should prefer agent.image over the top-level image
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      image: "example.test/collector:0.152.0"
      agent.image: "example.test/agent:0.153.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/agent:0.153.0"

  - it: should fail to render when a pinned collector image is below the floor
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.test/agent:0.151.0"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "collector image \"example.test/agent:0.151.0\" is < v0.152.0; this chart's default config uses the kubelet_stats receiver type, which older collectors reject with `unknown type`. Pin a v0.152.0+ image."

  - it: should accept a pinned collector image at the floor
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.image: "example.test/agent:0.152.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/agent:0.152.0"

  - it: should not set a priorityClassName by default
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.priorityClassName

  - it: should set the priorityClassName when the PriorityClass is created
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.priorityClass.create: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.priorityClassName
          value: "test-release-opentelemetry-kube-stack-agent"

  - it: should honour a custom PriorityClass name
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.priorityClass.create: true
      agent.priorityClass.name: "custom-agent-priority"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.priorityClassName
          value: "custom-agent-priority"

  - it: should use an existing PriorityClass without creating one
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.priorityClass.name: "system-node-critical"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.priorityClassName
          value: "system-node-critical"
  - it: should check memory every second
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # 1s is the value the memory_limiter README recommends.
      - equal:
          path: spec.config.processors.memory_limiter.check_interval
          value: 1s

  - it: should set GOMEMLIMIT to 80% of the memory limit
    set:
      clusterName: "test-cluster"
      agent.enabled: true
    release:
      name: "test-release"
    asserts:
      # 80% of the default 512Mi limit, in bytes. The Go runtime does not read
      # cgroup limits, so without this the GC never learns it has a budget.
      - contains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "429496729"

  - it: should derive GOMEMLIMIT from an overridden memory limit
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.resources.limits.memory: 4Gi
    release:
      name: "test-release"
    asserts:
      - contains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "3435973836"

  - it: should derive GOMEMLIMIT from a decimal memory limit
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.resources.limits.memory: 512M
    release:
      name: "test-release"
    asserts:
      - contains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "409600000"

  - it: should omit GOMEMLIMIT when there is no memory limit
    set:
      clusterName: "test-cluster"
      agent.enabled: true
      agent.resources.limits.cpu: 500m
      resources: {}
    release:
      name: "test-release"
    asserts:
      # No limit means no percentage to take, so the variable is left unset
      # rather than given a made-up value.
      - notContains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "429496729"
