---
suite: cluster-receiver tests
templates:
  - cluster-receiver.yaml
tests:
  - it: should create deployment with default values
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"
      # The shared top-level image reaches the collector.
      - equal:
          path: spec.image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0

  - it: should not include tsuga exporter when enabledForClusterReceiver is false
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForClusterReceiver: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should collect k8s objects by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.receivers.k8s_objects
      - contains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should not collect k8s objects when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sobjects: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNull:
          path: spec.config.receivers.k8s_objects
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should guard logs and metrics pipelines with memory_limiter first
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.processors.memory_limiter
      - equal:
          path: spec.config.service.pipelines.logs.processors[0]
          value: memory_limiter
      - equal:
          path: spec.config.service.pipelines.metrics.processors[0]
          value: memory_limiter

  - it: should pin the cluster receiver to a single replica
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # k8s_cluster emits gauges and non-monotonic sums only, and cumulative_to_delta
  # converts neither, so it must not be configured here.
  - it: should not run cumulative_to_delta
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors.cumulative_to_delta
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, k8s_attributes, resource, batch]

  - it: should fail to render when clusterName is not set
    set:
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should detect resources when enabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      resourceDetection.enabled: true
      resourceDetection.detectors: [env, gcp]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.resource_detection.detectors
          value: [env, gcp]
      - equal:
          path: spec.config.processors.resource_detection.override
          value: false
      # gcp can supply k8s.cluster.name, but the resource processor upserts
      # clusterName afterwards, so the explicit value stays authoritative.
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, resource_detection, k8s_attributes, resource, batch]

  - it: should collect only Warning events, filtered at the API server
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers["k8s_objects/events"].objects
          value:
            - group: events.k8s.io
              name: events
              mode: watch
              field_selector: type=Warning
              exclude_watch_type:
                - DELETED
      # A separate instance purely so events can skip the initial snapshot:
      # the field is receiver-wide and the pods stream needs it.
      - equal:
          path: spec.config.receivers["k8s_objects/events"].include_initial_state
          value: false
      - equal:
          path: spec.config.receivers.k8s_objects.include_initial_state
          value: true

  - it: should not collect events by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.receivers["k8s_objects/events"]
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects/events

  - it: should keep collecting events when pod objects are disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: true
      cluster.collectk8sobjects: false
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.receivers.k8s_objects
      - isNotNull:
          path: spec.config.receivers["k8s_objects/events"]

  - it: should give events their own pipeline and a real severity
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: true
    release:
      name: "test-release"
    asserts:
      # Tsuga normalizes a missing level to INFO, which would file every OOMKill
      # as routine.
      - equal:
          path: spec.config.processors["transform/k8s_event_severity"].log_statements
          value:
            - set(log.severity_text, "WARN")
            - set(log.severity_number, SEVERITY_NUMBER_WARN)
      # Own pipeline, so the transform never sees a non-map body: indexing one
      # errors per record.
      - equal:
          path: spec.config.service.pipelines["logs/events"].receivers
          value: [k8s_objects/events]
      - equal:
          path: spec.config.service.pipelines["logs/events"].processors
          value: [memory_limiter, transform/k8s_event_severity, resource, batch]
      # Events do not reach the shared logs pipeline.
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects/events

  - it: should not render the events pipeline or transform when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: false
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors["transform/k8s_event_severity"]
      - isNull:
          path: spec.config.service.pipelines["logs/events"]

  - it: should detect resources on the events pipeline too
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: true
      resourceDetection.enabled: true
    release:
      name: "test-release"
    asserts:
      # Otherwise events are the one signal with no cloud.* or host.id.
      - equal:
          path: spec.config.service.pipelines["logs/events"].processors
          value: [memory_limiter, resource_detection, transform/k8s_event_severity, resource, batch]

  - it: should give the cluster receiver a health_check extension
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      # Without this the deployment has no liveness probe, so a wedged cluster
      # receiver is never restarted.
      - equal:
          path: spec.config.extensions.health_check.endpoint
          value: ${env:MY_POD_IP}:13133
      - equal:
          path: spec.config.service.extensions
          value: [health_check]

  - it: should let the cluster collection interval and reported conditions change
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectionInterval: 60s
      cluster.nodeConditionsToReport: [Ready, NetworkUnavailable]
      cluster.allocatableTypesToReport: [cpu, memory, pods]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers.k8s_cluster.collection_interval
          value: 60s
      - equal:
          path: spec.config.receivers.k8s_cluster.node_conditions_to_report
          value: [Ready, NetworkUnavailable]
      - equal:
          path: spec.config.receivers.k8s_cluster.allocatable_types_to_report
          value: [cpu, memory, pods]

  - it: should let the exporter encoding and compression change
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.encoding: proto
      tsuga.compression: zstd
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.exporters['otlp_http/tsuga'].encoding
          value: proto
      - equal:
          path: spec.config.exporters['otlp_http/tsuga'].compression
          value: zstd

  - it: should report allocatable types the node object actually carries
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      # ephemeral-storage, not storage: the receiver looks each name up verbatim
      # in status.allocatable, where `storage` never appears, so it produced no
      # metric and logged the miss at debug level only.
      - equal:
          path: spec.config.receivers.k8s_cluster.allocatable_types_to_report
          value: [cpu, memory, ephemeral-storage]

  - it: should not re-report warning events when the API server expires them
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: true
    release:
      name: "test-release"
    asserts:
      # An expiry arrives on the watch as DELETED carrying the original event,
      # which without this reads as a second occurrence hours later.
      - equal:
          path: spec.config.receivers["k8s_objects/events"].objects[0].exclude_watch_type
          value: [DELETED]
      - equal:
          path: spec.config.receivers["k8s_objects/events"].objects[0].field_selector
          value: type=Warning

  - it: should apply the version floor to the cluster receiver's own image
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.image: "example.com/collector:0.150.0"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorPattern: "collector:0\\.150\\.0\" is older than v0\\.157\\.0"
