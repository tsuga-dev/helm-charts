---
suite: cluster-receiver tests
templates:
  - cluster-receiver.yaml
tests:
  - it: should create deployment with default values
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should not include tsuga exporter when enabledForClusterReceiver is false
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForClusterReceiver: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should collect k8s objects by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.receivers.k8s_objects
      - contains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should not collect k8s objects when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sobjects: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNull:
          path: spec.config.receivers.k8s_objects
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should guard logs and metrics pipelines with memory_limiter first
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.processors.memory_limiter
      - equal:
          path: spec.config.service.pipelines.logs.processors[0]
          value: memory_limiter
      - equal:
          path: spec.config.service.pipelines.metrics.processors[0]
          value: memory_limiter

  - it: should pin the cluster receiver to a single replica
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # k8s_cluster emits gauges and non-monotonic sums only, and cumulativetodelta
  # converts neither, so it must not be configured here.
  - it: should not run cumulativetodelta
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors.cumulativetodelta
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, filter/empty_replicasets, k8s_attributes, resource, batch]

  - it: should fail to render when clusterName is not set
    set:
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should leave the collector image to the operator by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.image

  - it: should honour the top-level image for the cluster receiver
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      image: "example.test/collector:0.152.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/collector:0.152.0"

  - it: should never surge a second cluster receiver during a rollout
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      # maxUnavailable is explicit for clarity; Kubernetes would promote it to
      # 1 anyway once both fenceposts resolved to zero.
      - equal:
          path: spec.deploymentUpdateStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.deploymentUpdateStrategy.rollingUpdate.maxSurge
          value: 0
      - equal:
          path: spec.deploymentUpdateStrategy.rollingUpdate.maxUnavailable
          value: 1

  - it: should check memory every second and set GOMEMLIMIT
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.memory_limiter.check_interval
          value: 1s
      - contains:
          path: spec.env
          content:
            name: GOMEMLIMIT
            value: "429496729"

  - it: should not scope the cluster receiver informer to one node
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      # The cluster receiver is cluster-scoped by design.
      - isNull:
          path: spec.config.processors.k8s_attributes.filter

  - it: should detect resources when enabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      resourceDetection.enabled: true
      resourceDetection.detectors: [env, gcp]
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.processors.resourcedetection.detectors
          value: [env, gcp]
      - equal:
          path: spec.config.processors.resourcedetection.override
          value: false
      # gcp can supply k8s.cluster.name, but the resource processor upserts
      # clusterName afterwards, so the explicit value stays authoritative.
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, filter/empty_replicasets, resourcedetection, k8s_attributes, resource, batch]

  - it: should collect only Warning events, filtered at the API server
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.config.receivers["k8s_objects/events"].objects
          value:
            - group: events.k8s.io
              name: events
              mode: watch
              field_selector: type=Warning
      # A separate instance purely so events can skip the initial snapshot:
      # the field is receiver-wide and the pods stream needs it.
      - equal:
          path: spec.config.receivers["k8s_objects/events"].include_initial_state
          value: false
      - equal:
          path: spec.config.receivers.k8s_objects.include_initial_state
          value: true

  - it: should not collect events when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: false
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.receivers["k8s_objects/events"]
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects/events

  - it: should keep collecting events when pod objects are disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sobjects: false
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.receivers.k8s_objects
      - isNotNull:
          path: spec.config.receivers["k8s_objects/events"]

  - it: should give events their own pipeline and a real severity
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      # Tsuga normalizes a missing level to INFO, which would file every OOMKill
      # as routine.
      - equal:
          path: spec.config.processors["transform/k8s_event_severity"].log_statements
          value:
            - set(log.severity_text, "WARN")
            - set(log.severity_number, SEVERITY_NUMBER_WARN)
      # Own pipeline, so the transform never sees a non-map body: indexing one
      # errors per record.
      - equal:
          path: spec.config.service.pipelines["logs/events"].receivers
          value: [k8s_objects/events]
      - equal:
          path: spec.config.service.pipelines["logs/events"].processors
          value: [memory_limiter, transform/k8s_event_severity, resource, batch]
      # Events do not reach the shared logs pipeline.
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects/events

  - it: should not render the events pipeline or transform when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sevents: false
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors["transform/k8s_event_severity"]
      - isNull:
          path: spec.config.service.pipelines["logs/events"]

  - it: should detect resources on the events pipeline too
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      resourceDetection.enabled: true
    release:
      name: "test-release"
    asserts:
      # Otherwise events are the one signal with no cloud.* or host.id.
      - equal:
          path: spec.config.service.pipelines["logs/events"].processors
          value: [memory_limiter, resourcedetection, transform/k8s_event_severity, resource, batch]
  - it: should drop zero-valued replicaset metrics
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      # value_int because both metrics are Gauge/Int. value_double on an int
      # datapoint returns 0.0 rather than erroring, so it would match every
      # integer datapoint.
      - equal:
          path: spec.config.processors["filter/empty_replicasets"].metric_conditions
          value:
            - (metric.name == "k8s.replicaset.available" or metric.name == "k8s.replicaset.desired") and datapoint.value_int == 0
      # propagate, the default, would drop the whole payload on a condition
      # error.
      - equal:
          path: spec.config.processors["filter/empty_replicasets"].error_mode
          value: ignore
      # Early, so the drop happens before enrichment does work on them.
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, filter/empty_replicasets, k8s_attributes, resource, batch]
