---
suite: cluster-receiver tests
templates:
  - cluster-receiver.yaml
tests:
  - it: should create deployment with default values
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      serviceAccount.create: true
      serviceAccount.name: ""
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.serviceAccount
          value: "test-release-opentelemetry-kube-stack"

  - it: should not include tsuga exporter when enabledForClusterReceiver is false
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
      tsuga.enabledForClusterReceiver: false
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: spec.config.service.pipelines.logs.exporters
          value: []

  - it: should collect k8s objects by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.receivers.k8s_objects
      - contains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should not collect k8s objects when disabled
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      cluster.collectk8sobjects: false
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNull:
          path: spec.config.receivers.k8s_objects
      - notContains:
          path: spec.config.service.pipelines.logs.receivers
          content: k8s_objects

  - it: should guard logs and metrics pipelines with memory_limiter first
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - isNotNull:
          path: spec.config.processors.memory_limiter
      - equal:
          path: spec.config.service.pipelines.logs.processors[0]
          value: memory_limiter
      - equal:
          path: spec.config.service.pipelines.metrics.processors[0]
          value: memory_limiter

  - it: should pin the cluster receiver to a single replica
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # k8s_cluster emits gauges and non-monotonic sums only, and cumulativetodelta
  # converts neither, so it must not be configured here.
  - it: should not run cumulativetodelta
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.config.processors.cumulativetodelta
      - equal:
          path: spec.config.service.pipelines.logs.processors
          value: [memory_limiter, k8s_attributes, resource, batch]
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value: [memory_limiter, k8s_attributes, resource, batch]

  - it: should fail to render when clusterName is not set
    set:
      cluster.enabled: true
      tsuga.otlpEndpoint: "https://intake.<CLUSTER_ID>.tsuga.com:443/api/v1/otlp"
      tsuga.apiKey: "<TSUGA_API_KEY>"
    release:
      name: "test-release"
    asserts:
      - failedTemplate:
          errorMessage: "clusterName is required: it identifies this cluster in telemetry. Set it with --set clusterName=<name> or in your values file."

  - it: should leave the collector image to the operator by default
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
    release:
      name: "test-release"
    asserts:
      - isNull:
          path: spec.image

  - it: should honour the top-level image for the cluster receiver
    set:
      clusterName: "test-cluster"
      cluster.enabled: true
      image: "example.test/collector:0.152.0"
    release:
      name: "test-release"
    asserts:
      - equal:
          path: spec.image
          value: "example.test/collector:0.152.0"
