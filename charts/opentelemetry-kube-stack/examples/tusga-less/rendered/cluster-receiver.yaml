---
# Source: opentelemetry-kube-stack/templates/cluster-receiver.yaml
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: example-opentelemetry-kube-stack-cluster-receiver
  labels:
    app.kubernetes.io/name: opentelemetry-kube-stack
    app.kubernetes.io/instance: example
    app.kubernetes.io/component: cluster-receiver
    app.kubernetes.io/part-of: opentelemetry-kube-stack
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: "example"
    meta.helm.sh/release-namespace: "default"
spec:
  mode: deployment
  # Pinned, and deliberately not configurable. Upstream's kube-stack chart notes
  # that k8s_cluster and k8s_objects "MUST be used by a collector with a single
  # replica": they have no leader election, so a second replica reports the same
  # cluster state again, and every cluster metric is counted twice and every
  # Kubernetes object ingested twice. The operator's CRD already defaults
  # replicas to 1; setting it explicitly stops a `kubectl scale` (the CRD
  # exposes a scale subresource on .spec.replicas) from surviving a helm upgrade.
  replicas: 1
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceAccount: example-opentelemetry-kube-stack
  env:
    
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
    - name: NODE_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.hostIP
    - name: POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.uid
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
  config:
    receivers:
      k8s_cluster:
        allocatable_types_to_report:
        - cpu
        - memory
        - storage
        collection_interval: 10s
        metrics:
          k8s.pod.status_reason:
            enabled: true
        node_conditions_to_report:
        - Ready
        - MemoryPressure
        - DiskPressure
        - PIDPressure
      k8s_objects:
        auth_type: serviceAccount
        include_initial_state: true
        objects:
        - group: ""
          mode: watch
          name: pods
    processors:
      batch:
        send_batch_max_size: 5000
        send_batch_size: 5000
      k8s_attributes:
        extract:
          annotations:
          - from: pod
            key: resource.opentelemetry.io/service.name
            tag_name: service.name
          - from: pod
            key: resource.opentelemetry.io/service.version
            tag_name: service.version
          - from: pod
            key: resource.opentelemetry.io/env
            tag_name: env
          - from: pod
            key: resource.opentelemetry.io/team
            tag_name: team
          labels:
          - from: pod
            key: resource.opentelemetry.io/service.name
            tag_name: service.name
          - from: pod
            key: resource.opentelemetry.io/service.version
            tag_name: service.version
          - from: pod
            key: resource.opentelemetry.io/env
            tag_name: env
          - from: pod
            key: resource.opentelemetry.io/team
            tag_name: team
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - action: upsert
          key: k8s.cluster.name
          value: test-cluster
    exporters:
      debug: {}
    service:
      extensions: []
      pipelines:
        logs:
          exporters:
          - debug
          processors:
          - memory_limiter
          - k8s_attributes
          - resource
          - batch
          receivers:
          - k8s_cluster
          - k8s_objects
        metrics:
          exporters:
          - debug
          processors:
          - memory_limiter
          - k8s_attributes
          - resource
          - batch
          receivers:
          - k8s_cluster
      telemetry:
        resource:
          k8s.cluster.name: test-cluster
          service.instance.id: ${POD_UID}
