---
postgres:
  enabled: false
  image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0"
  # The sidecar shares the Postgres pod, so bound it explicitly: memory_limiter
  # percentages and the operator-set GOMEMLIMIT both derive from this limit.
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Where the sidecar sends its own metrics. Defaults to the node agent's OTLP/gRPC
  # receiver, like the database metrics. The scheme picks TLS: http:// is plaintext.
  # With http/protobuf, include the path, e.g. http://$(K8S_NODE_IP):4318/v1/metrics.
  selfTelemetry:
    protocol: grpc
    endpoint: "http://$(K8S_NODE_IP):4317"
  databases:
    - name: postgresql
      # Namespace where the annotated Postgres pod runs. Replicates the monitor secret there and
      # sets the expected inject annotation to "<releaseNamespace>/<sidecar-name>" when different.
      namespace: ""
      sidecar-name: postgres-dbm-sidecar
      # Logical database holding the monitoring role, the otel schema and its
      # functions. Defaults to "otel".
      database: otel
      user: ""
      pwd: ""
      port: 5432
      host: ""

# Installs the Argo Events controller when argoEvents.enabled is true.
# CRDs are shipped in this chart's crds/ directory (installed before other resources).
argo-events:
  enabled: true
  crds:
    install: false

argoEvents:
  # When true, watch for pods with sidecar.opentelemetry.io/inject and trigger setup jobs.
  enabled: true
  # When true, Argo Events sensors create setup jobs instead of Helm post-install hooks.
  triggerSetupJob: true
  # Pod annotation key used by the OpenTelemetry Operator for sidecar injection.
  sidecarInjectAnnotation: sidecar.opentelemetry.io/inject
  eventBusName: default
  eventBus:
    # Argo Events requires an EventBus in the namespace; the controller subchart does not create one.
    create: true
    replicas: 1
    auth: none
  eventSource:
    name: ""
    watchNamespace: ""
    serviceAccount:
      create: true
      name: ""
  sensor:
    serviceAccount:
      create: true
      name: ""
  job:
    generateNameSuffix: "setup-"
