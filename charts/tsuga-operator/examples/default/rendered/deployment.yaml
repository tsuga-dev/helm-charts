---
# Source: tsuga-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-tsuga-operator
  namespace: default
  labels:
    helm.sh/chart: tsuga-operator-0.3.0
    app.kubernetes.io/name: tsuga-operator
    app.kubernetes.io/instance: example
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tsuga-operator
      app.kubernetes.io/instance: example
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      annotations:
        checksum/credentials: 45dde7812ded47d0e7b063e68e0c61e66f3041b5ea35924dfd258ce0543b1954
      labels:
        helm.sh/chart: tsuga-operator-0.3.0
        app.kubernetes.io/name: tsuga-operator
        app.kubernetes.io/instance: example
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/version: "0.5.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: example-tsuga-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/tsuga-dev/tsuga-operator:0.5.0"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          env:
            - name: TSUGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tsuga-credentials
                  key: api-token
            - name: TSUGA_BASE_URL
              value: "https://api.tsuga.com"
          ports:
            - name: healthz
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 10
