apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/instance: example
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tsuga-operator
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: tsuga-operator-0.1.0
  name: tsugacollectorconfigs.observability.tsuga.com
spec:
  group: observability.tsuga.com
  names:
    kind: TsugaCollectorConfig
    listKind: TsugaCollectorConfigList
    plural: tsugacollectorconfigs
    shortNames:
    - tcc
    singular: tsugacollectorconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TsugaCollectorConfigSpec is the desired cluster collection
              topology.
            properties:
              agent:
                description: TelemetryToggles enables signal types on the node agent.
                properties:
                  logs:
                    default: true
                    type: boolean
                  metrics:
                    default: true
                    type: boolean
                  traces:
                    default: true
                    type: boolean
                required:
                - logs
                - metrics
                - traces
                type: object
              clusterName:
                description: |-
                  Human-readable cluster name added as k8s.cluster.name. It is spliced
                  into the collector YAML, so the pattern keeps out quotes, backslashes
                  and newlines.
                maxLength: 253
                pattern: ^[A-Za-z0-9]([A-Za-z0-9 ._-]*[A-Za-z0-9])?$
                type: string
              collectorNamespace:
                default: tsuga-operator-system
                description: Namespace where the managed collectors are created.
                type: string
              export:
                description: ExportSpec describes how telemetry is exported to Tsuga.
                properties:
                  endpoint:
                    description: |-
                      Literal OTLP endpoint, used when EndpointSecretRef is nil. It is spliced
                      into the collector YAML, so the pattern requires an https URL (the
                      Bearer token must not travel in cleartext) and keeps out whitespace,
                      quotes, backslashes and $ (collector expansion).
                    maxLength: 2048
                    pattern: ^https://[^\s"'\\$]+$
                    type: string
                  endpointSecretRef:
                    description: Optional secret holding the Tsuga OTLP endpoint.
                      If nil, Endpoint is used.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tokenSecretRef:
                    description: Secret holding the Tsuga API key.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - tokenSecretRef
                type: object
                x-kubernetes-validations:
                - message: export requires endpointSecretRef or a non-empty endpoint
                  rule: has(self.endpointSecretRef) || (has(self.endpoint) && size(self.endpoint)
                    > 0)
              gateway:
                description: GatewayToggles enables cluster-scoped receivers on the
                  gateway collector.
                properties:
                  clusterMetrics:
                    default: true
                    type: boolean
                  kubernetesObjects:
                    default: true
                    type: boolean
                required:
                - clusterMetrics
                - kubernetesObjects
                type: object
              image:
                description: OTel Collector image override (defaults handled by the
                  OTel Operator when empty).
                type: string
              prometheus:
                description: |-
                  Prometheus configures the annotation-scraping collector. Absent means
                  no scraper is rendered.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled renders the scraper collector. Off by default: annotation
                      scraping can add substantial cardinality on a cluster dense in
                      annotated pods, so it is opted into deliberately.
                    type: boolean
                  replicas:
                    default: 1
                    description: |-
                      Scraper replicas. Values above 1 require the Target Allocator, which is
                      what divides the targets between them.
                    format: int32
                    minimum: 1
                    type: integer
                  scrapeInterval:
                    default: 30s
                    description: |-
                      How often to scrape each target, e.g. "60s". This does not set how often
                      the collector re-polls the Target Allocator: the OTel Operator writes
                      that interval itself.
                    pattern: ^[0-9]+(ms|s|m|h)$
                    type: string
                  targetAllocator:
                    default:
                      allocationStrategy: consistent-hashing
                      enabled: false
                    description: |-
                      TargetAllocatorSpec enables the Target Allocator, which decouples Prometheus
                      service discovery from scraping so the scraper collector can run more than
                      one replica without every replica scraping every target.
                    properties:
                      allocationStrategy:
                        default: consistent-hashing
                        description: |-
                          How the Target Allocator spreads targets across scraper replicas.
                          per-node assigns only targets that resolve to a node, so anything else
                          is left unscraped.
                        enum:
                        - consistent-hashing
                        - least-weighted
                        - per-node
                        type: string
                      enabled:
                        default: false
                        type: boolean
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'prometheus.replicas > 1 requires prometheus.targetAllocator.enabled:
                    without the Target Allocator every replica scrapes every target'
                  rule: '!has(self.replicas) || self.replicas <= 1 || (has(self.targetAllocator)
                    && self.targetAllocator.enabled)'
              resources:
                description: |-
                  Resources overrides the CPU/memory requests and limits applied to the
                  agent, the gateway and, when enabled, the Prometheus scraper. The default sizes a cluster of up to ~50 nodes; the gateway
                  holds the whole cluster's object state in memory and cannot be scaled
                  out, so raise the limit with the cluster (roughly 2Gi at 100 nodes, 4Gi
                  at 250). The agent's memory_limiter is a percentage of the container
                  limit, so removing limits entirely makes it measure against the node.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
            required:
            - agent
            - export
            - gateway
            type: object
          status:
            description: CollectionStatus is the observed state shared by collection
              CRDs.
            properties:
              conditions:
                description: |-
                  Conditions carries the standard Kubernetes condition set. Both
                  collection controllers publish a single "Ready" condition whose reason
                  names the reconcile stage that failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
