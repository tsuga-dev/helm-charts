{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ required "credentials.apiToken is required when credentials.create is true" .Values.credentials.apiToken | quote }}
  {{- with .Values.credentials.apiKey }}
  api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.otlpEndpoint }}
  otlp-endpoint: {{ . | quote }}
  {{- end }}
{{- end }}
