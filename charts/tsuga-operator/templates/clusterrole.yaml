{{- if .Values.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsuga-operator.fullname" . }}-manager
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - patch
- apiGroups:
  - ""
  resources:
  - endpoints
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - replicationcontrollers
  - resourcequotas
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/proxy
  - nodes/stats
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  - extensions
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - observability.tsuga.com
  resources:
  - dashboards
  - monitors
  - slos
  - tsugamonitorings
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - observability.tsuga.com
  resources:
  - dashboards/status
  - monitors/status
  - slos/status
  - tsugacollectorconfigs/finalizers
  - tsugacollectorconfigs/status
  - tsugamonitorings/finalizers
  - tsugamonitorings/status
  - tsugapostgresmonitorings/finalizers
  - tsugapostgresmonitorings/status
  verbs:
  - update
- apiGroups:
  - observability.tsuga.com
  resources:
  - tsugacollectorconfigs
  - tsugapostgresmonitorings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - opentelemetry.io
  resources:
  - instrumentations
  - opentelemetrycollectors
  - targetallocators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - create
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - tsuga-operator-collector
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - tsuga-operator-collector-tsuga-agent
  - tsuga-operator-collector-tsuga-gateway
  - tsuga-operator-collector-tsuga-scraper
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - delete
  - patch
{{- if include "tsuga-operator.metricsSecure" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsuga-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsuga-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
{{- end }}
