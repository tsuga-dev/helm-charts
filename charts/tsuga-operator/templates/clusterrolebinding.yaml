{{- if .Values.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsuga-operator.fullname" . }}-manager
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tsuga-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tsuga-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if include "tsuga-operator.metricsSecure" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsuga-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "tsuga-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tsuga-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "tsuga-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
